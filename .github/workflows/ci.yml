name: ci

on:
  push:
  pull_request:

jobs:
  base:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        exclude:
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # One lane. The scientific stack -- pymatgen, orix, diffsims, KikuchiPy,
      # matplotlib, h5py -- moved into the required dependencies in 0.5.0, so
      # `.[dev,docs]` installs everything the suite exercises and the separate
      # `full-scientific` job that used to add `[adapters]` has nothing left to
      # add. Its skip gate lives in the test step below.
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,docs]'
      - name: Repo integrity
        run: python scripts/check_repo_integrity.py
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Docs build
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: python scripts/check_sphinx_warnings.py --max-warnings 0
      # `-rs` and the gate below are what stop this lane from passing by not
      # running. Every scientific dependency is required as of 0.5.0, so a test
      # that skips because a package is absent means the environment is broken,
      # not that the test was optional.
      - name: Test with coverage ratchet
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -rs --cov=pytex --cov-report=term --cov-fail-under=87 | tee pytest-rs.txt
          deps='diffsims|h5py|jsonschema|kikuchipy|matplotlib|orix|pymatgen'
          if grep -E '^SKIPPED' pytest-rs.txt | grep -Ei "$deps"; then
            echo "::error::A test skipped because a dependency was missing."
            echo "::error::Every package above is a required dependency; the install is incomplete."
            exit 1
          fi

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # A plain `pip install -e .` is the point: this job proves that what a
      # user gets from an ordinary install can actually serve the workbench.
      # Before 0.5.0 it could not -- matplotlib was an extra, so every figure
      # route answered 500 and this job had been red for weeks.
      - name: Install workbench and browser-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          npm ci
          npx playwright install --with-deps chromium
      - name: Critical Chromium journeys
        run: npm run test:browser
