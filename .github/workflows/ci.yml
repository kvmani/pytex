name: ci

on:
  push:
  pull_request:

jobs:
  base:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        exclude:
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install base lane
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,docs]'
      - name: Repo integrity
        run: python scripts/check_repo_integrity.py
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Docs build
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: python scripts/check_sphinx_warnings.py --max-warnings 0
      - name: Test with coverage ratchet
        run: python -m pytest -q --cov=pytex --cov-report=term --cov-fail-under=87

  full-scientific:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install full scientific lane
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,docs,adapters]'
      - name: Repo integrity
        run: python scripts/check_repo_integrity.py
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Test with optional scientific stack
        # This lane exists to prove the optional scientific stack is actually
        # exercised, so a test that skips *because an optional dependency is
        # missing* fails it. It used to reject every skip, which became
        # unsatisfiable the moment an operation legitimately could not run from
        # defaults -- an upload route needs a file from the user, and the
        # manifest test skips it by design. Rejecting that skip would have
        # forced a worse design on the application to satisfy a check that had
        # stopped describing its own intent.
        run: |
          set -euo pipefail
          python -m pytest -q -rs | tee pytest-rs.txt
          if grep -E "^SKIPPED" pytest-rs.txt \
             | grep -Ei "pymatgen|orix|kikuchipy|diffsims|matplotlib|h5py|hdf5|extra"; then
            echo "::error::A test skipped because an optional dependency was missing."
            echo "::error::This lane installs .[dev,docs,adapters]; the stack must be exercised."
            exit 1
          fi

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install workbench and browser-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          npm ci
          npx playwright install --with-deps chromium
      - name: Critical Chromium journeys
        run: npm run test:browser
