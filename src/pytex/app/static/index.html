<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PyTex Workbench</title>
    <!-- Named explicitly: without it every load asks for /favicon.ico and is
         answered with a 404 in the server log of an application that otherwise
         logs only real requests. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/app.css" />
    <script src="/browser_support.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#workspace">Skip to the workspace</a>

    <header class="masthead">
      <div class="masthead__brand">
        <span class="masthead__mark" aria-hidden="true"></span>
        <div>
          <h1>PyTex Workbench</h1>
          <p class="masthead__tagline" id="masthead-tagline">Loading…</p>
        </div>
      </div>
      <nav class="tabs" id="tabs" aria-label="Workspaces"></nav>
      <div class="masthead__actions">
        <button
          type="button"
          class="button button--icon"
          id="cycle-theme"
          title="Colour theme: follow the system"
          aria-label="Colour theme: follow the system"
        >
          <span id="theme-icon" aria-hidden="true">◐</span>
          <span class="masthead__action-label" id="theme-label">Auto</span>
        </button>
        <button type="button" class="button" id="open-palette" title="Search every feature (Ctrl+K)">
          <span aria-hidden="true">⌕</span>
          <span class="masthead__action-label">Find a feature</span>
        </button>
        <button type="button" class="button" id="open-help" title="What this panel does">
          <span aria-hidden="true">?</span>
          <span class="masthead__action-label">Help</span>
        </button>
        <a
          href="/docs/index.html"
          target="_blank"
          rel="noopener noreferrer"
          class="button"
          id="open-docs"
          title="In-app scientific documentation, theory, and worked examples"
        >
          <span aria-hidden="true">📖</span>
          <span class="masthead__action-label">Docs</span>
        </a>
        <button
          type="button"
          class="button"
          id="open-feedback"
          title="Tell us what would make PyTex better"
        >
          <span aria-hidden="true">✉</span>
          <span class="masthead__action-label">Feedback</span>
        </button>
        <button type="button" class="button" id="open-about" title="Version, authorship, and licence">
          <span aria-hidden="true">ⓘ</span>
          <span class="masthead__action-label">About</span>
        </button>
      </div>
    </header>

    <!-- The sub-tab strip of a grouped workspace. Deliberately outside the
         stage: the stage's height is what every figure's height is a percentage
         of, and a navigation strip inside it would come out of the figure's
         budget on every panel, grouped or not. -->
    <nav class="subtabs" id="subtabs" aria-label="Sub-workspaces" hidden></nav>

    <main id="workspace" class="workspace">
      <section class="stage" id="stage" aria-live="polite">
        <div class="stage__placeholder" id="stage-placeholder">
          <p>Choose a workspace to begin.</p>
        </div>
      </section>

      <aside class="rail" id="rail" aria-label="Controls">
        <div class="rail__body" id="rail-body"></div>
      </aside>
    </main>

    <!-- The centralized message log. Built entirely by js/core/logbook.js: the
         page reserves the strip, and everything inside it — the summary bar, the
         filters, the stream — is constructed there, so there is one definition
         of what a log entry looks like rather than a markup half and a script
         half that can disagree. -->
    <section class="console" id="console" aria-label="Message log"></section>

    <div class="palette" id="palette" hidden role="dialog" aria-modal="true" aria-label="Find a feature">
      <div class="palette__panel">
        <input
          type="search"
          id="palette-input"
          class="palette__input"
          placeholder="Search operations, examples, and materials…"
          autocomplete="off"
          aria-label="Search"
        />
        <ul class="palette__results" id="palette-results" role="listbox"></ul>
        <p class="palette__hint">Enter to run · Esc to close</p>
      </div>
    </div>

    <div class="drawer" id="help-drawer" hidden role="dialog" aria-modal="true" aria-label="Help">
      <div class="drawer__panel">
        <button type="button" class="drawer__close" id="help-close" aria-label="Close help">×</button>
        <div class="drawer__body" id="help-body"></div>
      </div>
    </div>

    <!-- About reuses the help drawer's chrome deliberately: it is the same
         gesture — a panel of prose slid in over the workspace — and giving it a
         second visual language would say it is a different kind of thing. -->
    <div class="drawer" id="about-drawer" hidden role="dialog" aria-modal="true" aria-label="About PyTex">
      <div class="drawer__panel">
        <button type="button" class="drawer__close" id="about-close" aria-label="Close about">×</button>
        <div class="drawer__body" id="about-body"></div>
      </div>
    </div>

    <!-- Feedback reuses the drawer chrome for the same reason About does: it is
         the same gesture, a panel slid in over the workspace. Everything inside
         it is built by js/core/feedback.js from the invitation the server
         publishes, so a deployment can change what the form says without
         touching the page. -->
    <div
      class="drawer"
      id="feedback-drawer"
      hidden
      role="dialog"
      aria-modal="true"
      aria-label="Send feedback"
    >
      <div class="drawer__panel">
        <button type="button" class="drawer__close" id="feedback-close" aria-label="Close feedback">
          ×
        </button>
        <div class="drawer__body" id="feedback-body"></div>
      </div>
    </div>

    <div class="toasts" id="toasts" aria-live="assertive"></div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
