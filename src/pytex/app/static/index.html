<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PyTex Workbench</title>
    <!-- Named explicitly: without it every load asks for /favicon.ico and is
         answered with a 404 in the server log of an application that otherwise
         logs only real requests. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <a class="skip-link" href="#workspace">Skip to the workspace</a>

    <header class="masthead">
      <div class="masthead__brand">
        <span class="masthead__mark" aria-hidden="true"></span>
        <div>
          <h1>PyTex Workbench</h1>
          <p class="masthead__tagline" id="masthead-tagline">Loading…</p>
        </div>
      </div>
      <nav class="tabs" id="tabs" aria-label="Workspaces"></nav>
      <div class="masthead__actions">
        <button
          type="button"
          class="button button--icon"
          id="cycle-theme"
          title="Colour theme: follow the system"
          aria-label="Colour theme: follow the system"
        >
          <span id="theme-icon" aria-hidden="true">◐</span>
          <span class="masthead__action-label" id="theme-label">Auto</span>
        </button>
        <button type="button" class="button" id="open-palette" title="Search every feature (Ctrl+K)">
          <span aria-hidden="true">⌕</span>
          <span class="masthead__action-label">Find a feature</span>
        </button>
        <button type="button" class="button" id="open-help" title="What this panel does">
          <span aria-hidden="true">?</span>
          <span class="masthead__action-label">Help</span>
        </button>
      </div>
    </header>

    <main id="workspace" class="workspace">
      <section class="stage" id="stage" aria-live="polite">
        <div class="stage__placeholder" id="stage-placeholder">
          <p>Choose a workspace to begin.</p>
        </div>
      </section>

      <aside class="rail" id="rail" aria-label="Controls">
        <div class="rail__body" id="rail-body"></div>
      </aside>
    </main>

    <section class="activity" id="activity" aria-label="Calculation activity">
      <button
        type="button"
        class="activity__toggle"
        id="activity-toggle"
        aria-label="Open calculation activity"
        aria-expanded="false"
        aria-controls="activity-panel"
      >
        <span class="activity__indicator" id="activity-indicator" aria-hidden="true"></span>
        <span class="activity__summary" id="activity-summary" role="status" aria-live="polite">Ready</span>
        <span class="activity__count" id="activity-count">No calculations yet</span>
        <span aria-hidden="true">⌃</span>
      </button>
      <div class="activity__panel" id="activity-panel" hidden>
        <header class="activity__header">
          <div>
            <strong>Calculation activity</strong>
            <span>Recent service calls, duration and outcome</span>
          </div>
          <button type="button" class="button" id="activity-clear">Clear</button>
        </header>
        <ol class="activity__log" id="activity-log"></ol>
        <p class="activity__empty" id="activity-empty">Run a calculation to see its progress here.</p>
      </div>
    </section>

    <div class="palette" id="palette" hidden role="dialog" aria-modal="true" aria-label="Find a feature">
      <div class="palette__panel">
        <input
          type="search"
          id="palette-input"
          class="palette__input"
          placeholder="Search operations, examples, and materials…"
          autocomplete="off"
          aria-label="Search"
        />
        <ul class="palette__results" id="palette-results" role="listbox"></ul>
        <p class="palette__hint">Enter to run · Esc to close</p>
      </div>
    </div>

    <div class="drawer" id="help-drawer" hidden role="dialog" aria-modal="true" aria-label="Help">
      <div class="drawer__panel">
        <button type="button" class="drawer__close" id="help-close" aria-label="Close help">×</button>
        <div class="drawer__body" id="help-body"></div>
      </div>
    </div>

    <div class="toasts" id="toasts" aria-live="assertive"></div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
