<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">PyTex Current State And Planned Expansion</title>
  <desc id="desc">Roadmap diagram separating implemented or foundational surfaces from architecturally defined next validation and workflow expansions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#07122f" flood-opacity="0.14"/></filter>
    <marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="24.00" markerHeight="24.00" refX="20.00" refY="12.00" orient="auto"><path d="M4.00,4.00 L20.00,12.00 L4.00,20.00 Z" fill="#07122f"/></marker>
    <style>.title{font: 700 42px Arial;fill:#07122f}.subtitle{font: 20px Arial;fill:#40506f}.label{font: 700 20px Arial;fill:#07122f}.body{font: 15px Arial;fill:#40506f}.group{fill:#fbfdff;stroke-width:1.5;stroke-dasharray:5 5}.card{rx:8;filter:url(#shadow);stroke-width:2}.arrow{fill:none;stroke:#07122f;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="600" y="62" text-anchor="middle" class="title">Current State Versus Planned Expansion</text>
  <text x="600" y="96" text-anchor="middle" class="subtitle">The next work deepens validation and workflow breadth on top of the semantic foundation</text>
  <rect x="510" y="118" width="180" height="5" rx="3" fill="#2563eb"/><rect x="600" y="118" width="90" height="5" rx="3" fill="#7c3aed"/>

  <rect x="70" y="160" width="500" height="470" rx="18" class="group" stroke="#16a34a"/>
  <text x="96" y="198" class="label" fill="#16a34a">Implemented Or Foundational Today</text>
  <rect x="108" y="230" width="190" height="84.4" class="card" fill="#ecfdf5" stroke="#16a34a"/><text x="132" y="260" class="label">Core Model</text><text x="132" y="284" class="body"><tspan x="132" dy="0.0">frames, symmetry,</tspan><tspan x="132" dy="19.2">lattice</tspan></text>
  <rect x="342" y="230" width="190" height="84.4" class="card" fill="#ecfdf5" stroke="#16a34a"/><text x="366" y="260" class="label">Texture</text><text x="366" y="284" class="body"><tspan x="366" dy="0.0">PF, IPF, ODF,</tspan><tspan x="366" dy="19.2">harmonics</tspan></text>
  <rect x="108" y="340" width="190" height="84.4" class="card" fill="#ecfdf5" stroke="#16a34a"/><text x="132" y="370" class="label">EBSD</text><text x="132" y="394" class="body"><tspan x="132" dy="0.0">maps, grains, KAM,</tspan><tspan x="132" dy="19.2">GROD</tspan></text>
  <rect x="342" y="340" width="190" height="84.4" class="card" fill="#ecfdf5" stroke="#16a34a"/><text x="366" y="370" class="label">Diffraction</text><text x="366" y="394" class="body"><tspan x="366" dy="0.0">geometry, spots, XRD,</tspan><tspan x="366" dy="19.2">SAED</tspan></text>
  <rect x="108" y="450" width="190" height="84.5" class="card" fill="#ecfdf5" stroke="#16a34a"/><text x="132" y="480" class="label">Manifests</text><text x="132" y="504" class="body"><tspan x="132" dy="0.0">import, experiment,</tspan><tspan x="132" dy="19.2">evidence</tspan></text>
  <rect x="342" y="450" width="190" height="84.5" class="card" fill="#ecfdf5" stroke="#16a34a"/><text x="366" y="480" class="label">Visualization</text><text x="366" y="504" class="body"><tspan x="366" dy="0.0">YAML themes, SVG</tspan><tspan x="366" dy="19.2">figures</tspan></text>

  <rect x="630" y="160" width="500" height="470" rx="18" class="group" stroke="#e11d48"/>
  <text x="656" y="198" class="label" fill="#e11d48">Architecturally Defined Next</text>
  <rect x="668" y="230" width="220.0" height="76" class="card" fill="#fff1f2" stroke="#e11d48"/><text x="692" y="260" class="label">Structure Evidence</text><text x="692" y="284" class="body">broader CIF baselines</text>
  <rect x="902" y="230" width="206.5" height="84.4" class="card" fill="#fff1f2" stroke="#e11d48"/><text x="926" y="260" class="label">Multimodal Depth</text><text x="926" y="284" class="body"><tspan x="926" dy="0.0">XRD, neutron, TEM</tspan><tspan x="926" dy="19.2">workflows</tspan></text>
  <rect x="668" y="340" width="214.9" height="84.4" class="card" fill="#fff1f2" stroke="#e11d48"/><text x="692" y="370" class="label">Validation Breadth</text><text x="692" y="394" class="body"><tspan x="692" dy="0.0">fixtures, manifests,</tspan><tspan x="692" dy="19.2">ledgers</tspan></text>
  <rect x="902" y="340" width="190" height="84.4" class="card" fill="#fff1f2" stroke="#e11d48"/><text x="926" y="370" class="label">Transformations</text><text x="926" y="394" class="body"><tspan x="926" dy="0.0">variants, parent</tspan><tspan x="926" dy="19.2">recovery</tspan></text>
  <rect x="668" y="450" width="190" height="84.5" class="card" fill="#fff1f2" stroke="#e11d48"/><text x="692" y="480" class="label">Adapter Reality</text><text x="692" y="504" class="body"><tspan x="692" dy="0.0">live optional</tspan><tspan x="692" dy="19.2">dependency tests</tspan></text>
  <rect x="902" y="450" width="190" height="84.5" class="card" fill="#fff1f2" stroke="#e11d48"/><text x="926" y="480" class="label">Teaching Path</text><text x="926" y="504" class="body"><tspan x="926" dy="0.0">notebooks and</tspan><tspan x="926" dy="19.2">validation route</tspan></text>

  <path class="arrow" d="M532 268 C590 250 610 250 668 268"/>
  <path class="arrow" d="M532 378 C590 360 610 360 668 378"/>
  <path class="arrow" d="M298 488 C510 570 720 570 997 526"/>
  <path class="arrow" d="M437 416 C600 500 760 492 902 378"/>
  <path class="arrow" d="M203 306 C480 150 710 150 997 230"/>

  <rect x="244" y="660" width="761.7" height="34" rx="17" fill="#ffffff" stroke="#dbe4f0"/>
  <circle cx="282" cy="677" r="6" fill="#16a34a"/><text x="300" y="683" class="body">green: implemented or foundational</text>
  <circle cx="570" cy="677" r="6" fill="#e11d48"/><text x="588" y="683" class="body">rose: accepted hardening target before stronger public claims</text>
</svg>


