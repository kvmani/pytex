<text x="20" y="30" fill="#111827" font-size="15" font-weight="bold">The sin²ψ measurement geometry</text>
<text x="20" y="52" fill="#374151" font-size="12">m = (cos φ sin ψ, sin φ sin ψ, cos ψ);  ε(φ,ψ) = (d − d₀)/d₀ = m·ε·m</text>
<text x="20" y="422" fill="#374151" font-size="12">Drawn at φ = 60°, ψ = 50°. φ is measured in the surface from S1 towards S2; ψ from S3.</text>
