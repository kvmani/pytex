<svg xmlns="http://www.w3.org/2000/svg" width="1196" height="1089" viewBox="0 0 1196 1089" role="img">
  <title>Solving A Measured SAED Pattern</title>
  <desc>Three-lane flow sheet. Lane 1 converts picked spot positions into reciprocal-space vectors through the camera constant. Lane 2 seeds a solution from the two shortest non-collinear vectors, admits a calculated reflection pair only when both lengths and the interplanar angle match, and builds the zone axis and the crystal-to-pattern rotation from that pair. Lane 3 indexes every remaining spot by projection, deduplicates symmetry-equivalent solutions into the conventional description, and ranks the survivors with an explicit conclusiveness verdict. Side notes give the constraint governing each stage.</desc>
  <defs>
    <marker id="pytex-algo-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 z" fill="#40506f"/>
    </marker>
    <marker id="pytex-algo-arrow-flow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1196" height="1089" fill="#fbfdff"/>
  <text x="40.0" y="46.0" font-size="25" font-family="Arial" fill="#07122f" text-anchor="start">Solving A Measured SAED Pattern</text>
  <text x="40.0" y="72.0" font-size="13" font-family="Arial" fill="#40506f" text-anchor="start">solve_saed_pattern: classical ratio/angle indexing from a calibrated spot list. Geometry alone decides - intensities are never used.</text>
  <text x="40.0" y="96.0" font-size="13" font-family="Arial" fill="#7c3aed" text-anchor="start">1 - calibrate the picked spots</text>
  <rect x="40.0" y="108.0" width="236.0" height="178.0" rx="8" fill="#eef7f0" stroke="#a7ccb4" stroke-width="1.4"/>
  <text x="54.0" y="135.0" font-size="15" font-family="Arial" fill="#124a2a" text-anchor="start" font-weight="bold">Picked positions</text>
  <text x="54.0" y="154.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Clicked, or listed in the</text>
  <text x="54.0" y="170.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">measured-</text>
  <text x="54.0" y="186.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">pattern YAML. The transmitted</text>
  <text x="54.0" y="202.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">beam is</text>
  <text x="54.0" y="218.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">the centre, not a spot.</text>
  <rect x="310.0" y="108.0" width="236.0" height="178.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="324.0" y="135.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">To reciprocal space</text>
  <text x="324.0" y="157.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">|g| = r / (L lambda)</text>
  <text x="324.0" y="176.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Pixels scale by the pixel size</text>
  <text x="324.0" y="192.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">first.</text>
  <text x="324.0" y="208.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">The camera constant may be</text>
  <text x="324.0" y="224.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">given, or</text>
  <text x="324.0" y="240.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">derived from camera length and</text>
  <text x="324.0" y="256.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">kV.</text>
  <line x1="276.0" y1="197.0" x2="306.0" y2="197.0" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <rect x="856.0" y="108.0" width="300.0" height="122.0" rx="8" fill="#f7faff" stroke="#c8d8f2" stroke-width="1.0"/>
  <text x="872.0" y="133.0" font-size="14" font-family="Arial" fill="#07122f" text-anchor="start">Constraint: calibrate or fail early</text>
  <text x="872.0" y="156.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Coordinates in pixels or millimetres without</text>
  <text x="872.0" y="175.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">a camera constant are rejected at</text>
  <text x="872.0" y="194.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">construction, not at the first spot: an</text>
  <text x="872.0" y="213.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">uncalibrated length is not recoverable.</text>
  <line x1="158.0" y1="286.0" x2="158.0" y2="326.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#pytex-algo-arrow-flow)"/>
  <text x="40.0" y="320.0" font-size="13" font-family="Arial" fill="#7c3aed" text-anchor="start">2 - seed from two reflections</text>
  <rect x="40.0" y="332.0" width="236.0" height="197.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="54.0" y="359.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">Seed pairs</text>
  <text x="54.0" y="378.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">The shortest non-collinear</text>
  <text x="54.0" y="394.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">measured</text>
  <text x="54.0" y="410.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">vectors: best determined</text>
  <text x="54.0" y="426.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">relative to</text>
  <text x="54.0" y="442.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">picking error, and two of them</text>
  <text x="54.0" y="458.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">fix</text>
  <text x="54.0" y="474.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">the zone.</text>
  <rect x="310.0" y="332.0" width="236.0" height="197.0" rx="8" fill="#fdf6e8" stroke="#e6d4a8" stroke-width="1.4"/>
  <text x="324.0" y="359.0" font-size="15" font-family="Arial" fill="#6b4a06" text-anchor="start" font-weight="bold">Ratio and angle test</text>
  <text x="324.0" y="381.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">| |g_calc| - |g_obs| | /</text>
  <text x="324.0" y="400.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">|g_obs| &lt;= tol</text>
  <text x="324.0" y="419.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Both lengths must match a</text>
  <text x="324.0" y="435.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">calculated</text>
  <text x="324.0" y="451.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">allowed reflection, and the</text>
  <text x="324.0" y="467.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">interplanar angle must match</text>
  <text x="324.0" y="483.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">within</text>
  <text x="324.0" y="499.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">the angular tolerance.</text>
  <line x1="276.0" y1="430.5" x2="306.0" y2="430.5" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <rect x="580.0" y="332.0" width="236.0" height="197.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="594.0" y="359.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">Zone and orientation</text>
  <text x="594.0" y="381.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">z = g_1 x g_2, R = F E^T</text>
  <text x="594.0" y="400.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Right-handed triads from the</text>
  <text x="594.0" y="416.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">calculated pair and the</text>
  <text x="594.0" y="432.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">observed</text>
  <text x="594.0" y="448.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">pair; their product is the</text>
  <text x="594.0" y="464.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">crystal-to-pattern rotation.</text>
  <line x1="546.0" y1="430.5" x2="576.0" y2="430.5" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <rect x="856.0" y="332.0" width="300.0" height="122.0" rx="8" fill="#f7faff" stroke="#c8d8f2" stroke-width="1.0"/>
  <text x="872.0" y="357.0" font-size="14" font-family="Arial" fill="#07122f" text-anchor="start">Constraint: absences come from the phase</text>
  <text x="872.0" y="380.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Only reflections the phase's centring allows</text>
  <text x="872.0" y="399.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">are offered. A phase without a space group is</text>
  <text x="872.0" y="418.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">treated as primitive - the same trap as in</text>
  <text x="872.0" y="437.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">simulation, with the same consequence.</text>
  <rect x="856.0" y="468.0" width="300.0" height="141.0" rx="8" fill="#f7faff" stroke="#c8d8f2" stroke-width="1.0"/>
  <text x="872.0" y="493.0" font-size="14" font-family="Arial" fill="#07122f" text-anchor="start">Constraint: zone-axis pattern assumed</text>
  <text x="872.0" y="516.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">The spots must lie in one zero-order Laue</text>
  <text x="872.0" y="535.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">zone. A crystal tilted off zone - a variant</text>
  <text x="872.0" y="554.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">seen from a PARENT zone axis - is only partly</text>
  <text x="872.0" y="573.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">indexed, and that partial match is the honest</text>
  <text x="872.0" y="592.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">outcome, not a bug.</text>
  <line x1="158.0" y1="623.0" x2="158.0" y2="663.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#pytex-algo-arrow-flow)"/>
  <text x="40.0" y="657.0" font-size="13" font-family="Arial" fill="#7c3aed" text-anchor="start">3 - verify, rank, and judge</text>
  <rect x="40.0" y="669.0" width="236.0" height="181.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="54.0" y="696.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">Index every spot</text>
  <text x="54.0" y="715.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Project all allowed zone</text>
  <text x="54.0" y="731.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">reflections</text>
  <text x="54.0" y="747.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">and give each measured spot its</text>
  <text x="54.0" y="763.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">nearest free prediction within</text>
  <text x="54.0" y="779.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">its</text>
  <text x="54.0" y="795.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">match radius.</text>
  <rect x="310.0" y="669.0" width="236.0" height="181.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="324.0" y="696.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">Deduplicate and</text>
  <text x="324.0" y="715.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">canonicalize</text>
  <text x="324.0" y="737.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">R ~ R S for S in G</text>
  <text x="324.0" y="756.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Symmetry-equivalent solutions</text>
  <text x="324.0" y="772.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">are one</text>
  <text x="324.0" y="788.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">answer; the survivor is</text>
  <text x="324.0" y="804.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">rewritten as</text>
  <text x="324.0" y="820.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">the conventional description.</text>
  <line x1="276.0" y1="759.5" x2="306.0" y2="759.5" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <rect x="580.0" y="669.0" width="236.0" height="181.0" rx="8" fill="#f3eefc" stroke="#cdbdee" stroke-width="1.4"/>
  <text x="594.0" y="696.0" font-size="15" font-family="Arial" fill="#42227e" text-anchor="start" font-weight="bold">Ranked report</text>
  <text x="594.0" y="715.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Matched fraction first, then</text>
  <text x="594.0" y="731.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">residual.</text>
  <text x="594.0" y="747.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Phase, zone axis, orientation,</text>
  <text x="594.0" y="763.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">every</text>
  <text x="594.0" y="779.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">spot's indices, and</text>
  <text x="594.0" y="795.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">is_conclusive.</text>
  <line x1="546.0" y1="759.5" x2="576.0" y2="759.5" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <rect x="856.0" y="669.0" width="300.0" height="141.0" rx="8" fill="#f7faff" stroke="#c8d8f2" stroke-width="1.0"/>
  <text x="872.0" y="694.0" font-size="14" font-family="Arial" fill="#07122f" text-anchor="start">Ambiguity: intrinsic, not a failure</text>
  <text x="872.0" y="717.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">A single pattern cannot distinguish a zone</text>
  <text x="872.0" y="736.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">axis from its reverse for a centrosymmetric</text>
  <text x="872.0" y="755.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">reflection set: inverting the crystal leaves</text>
  <text x="872.0" y="774.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">the pattern unchanged. The report names this</text>
  <text x="872.0" y="793.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">rather than presenting one sense as the answer.</text>
  <rect x="856.0" y="824.0" width="300.0" height="141.0" rx="8" fill="#f7faff" stroke="#c8d8f2" stroke-width="1.0"/>
  <text x="872.0" y="849.0" font-size="14" font-family="Arial" fill="#07122f" text-anchor="start">Failure mode: no answer is an answer</text>
  <text x="872.0" y="872.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">best() raises rather than guessing when</text>
  <text x="872.0" y="891.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">nothing was solved. is_conclusive is False</text>
  <text x="872.0" y="910.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">whenever spots are left unindexed or a</text>
  <text x="872.0" y="929.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">genuinely different candidate explains the</text>
  <text x="872.0" y="948.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">pattern equally well.</text>
  <text x="40.0" y="1031.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Intensities are carried through for plotting but never used to index: a kinematic intensity model is not reliable enough, and a printed pattern rarely carries them.</text>
  <text x="40.0" y="1049.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Cubic example: an fcc pattern down [001], where the {220}/{200} radius ratio is exactly sqrt(2) at 45 degrees.  Hexagonal example: alpha-Ti down [0001].</text>
</svg>
