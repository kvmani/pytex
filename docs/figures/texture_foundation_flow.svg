<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">PyTex Texture Foundation Flow</title>
  <desc id="desc">Texture foundation workflow showing canonical core semantics feeding rotations, symmetry reduction, pole figures, ODF reconstruction, and IPF color outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#07122f" flood-opacity="0.14"/></filter>
    <marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="24.00" markerHeight="24.00" refX="20.00" refY="12.00" orient="auto"><path d="M4.00,4.00 L20.00,12.00 L4.00,20.00 Z" fill="#07122f"/></marker>
    <style>.title{font: Arial;fill:#07122f}.subtitle{font: Arial;fill:#40506f}.label{font: Arial;fill:#07122f}.body{font: Arial;fill:#40506f}.card{rx:8;filter:url(#shadow);stroke-width:2}.arrow{fill:none;stroke:#07122f;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1100" height="650" fill="url(#bg)"/>
  <text x="550" y="58" text-anchor="middle" class="title" font-family="Arial">Texture Foundation Flow</text>
  <text x="550" y="90" text-anchor="middle" class="subtitle" font-family="Arial">Orientation semantics drive PF, IPF, ODF, harmonic reconstruction, and color keys</text>
  <rect x="470" y="112" width="160" height="5" rx="3" fill="#2563eb"/><rect x="550" y="112" width="80" height="5" rx="3" fill="#7c3aed"/>

  <rect x="70" y="250" width="190" height="96" class="card" fill="#eff6ff" stroke="#2563eb"/>
  <text x="100" y="285" class="label" font-family="Arial">Canonical Core</text><text x="100" y="310" class="body" font-family="Arial"><tspan x="100" dy="0.0">frames, symmetry,</tspan><tspan x="100" dy="19.2">phase, orientation</tspan></text>
  <rect x="328" y="160" width="254.8" height="96" class="card" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="358" y="195" class="label" font-family="Arial">Rotation + Orientation</text><text x="358" y="220" class="body" font-family="Arial">Symmetry Reduction</text>
  <rect x="328" y="370" width="244.6" height="96" class="card" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="358" y="405" class="label" font-family="Arial">Symmetry Reduction</text><text x="358" y="430" class="body" font-family="Arial">orbits and sectors</text>
  <rect x="602" y="120" width="190" height="96" class="card" fill="#ecfeff" stroke="#0f9f9f"/>
  <text x="632" y="155" class="label" font-family="Arial">PF / IPF</text><text x="632" y="180" class="body" font-family="Arial"><tspan x="632" dy="0.0">specimen and crystal</tspan><tspan x="632" dy="19.2">views</tspan></text>
  <rect x="602" y="277" width="190" height="96" class="card" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="632" y="312" class="label" font-family="Arial">ODF</text><text x="632" y="337" class="body" font-family="Arial">kernel density queries</text>
  <rect x="602" y="434" width="190" height="96" class="card" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="632" y="469" class="label" font-family="Arial">Harmonic ODF</text><text x="632" y="494" class="body" font-family="Arial">band-limited inversion</text>
  <rect x="858" y="250" width="214.9" height="96" class="card" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="888" y="285" class="label" font-family="Arial">Teaching Outputs</text><text x="888" y="310" class="body" font-family="Arial"><tspan x="888" dy="0.0">figures, reports,</tspan><tspan x="888" dy="19.2">colors</tspan></text>

  <path class="arrow" d="M260 298 C300 260 306 218 328 208"/>
  <path class="arrow" d="M260 298 C300 336 306 404 328 418"/>
  <path class="arrow" d="M518 208 H602"/>
  <path class="arrow" d="M518 418 C560 410 584 350 602 325"/>
  <path class="arrow" d="M518 208 C562 225 584 276 602 325"/>
  <path class="arrow" d="M518 418 H602"/>
  <path class="arrow" d="M792 168 C830 190 848 238 858 282"/>
  <path class="arrow" d="M792 325 H858"/>
  <path class="arrow" d="M792 482 C830 460 848 374 858 330"/>
</svg>


