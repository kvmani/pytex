<svg xmlns="http://www.w3.org/2000/svg" width="1432" height="610" viewBox="0 0 1432 610" role="img">
  <title>PyTex Reference-Frame Chain</title>
  <desc>Crystal, specimen, map, detector, laboratory and reciprocal are distinct domains. The arrows name scientific relationships, not permission to collapse the frames. Frames shown in chain order: crystal (crystal, axes a/b/c); specimen (specimen, axes x/y/z); map (map, axes x/y/z); detector (detector, axes u/v/n); laboratory (laboratory, axes x_lab/y_lab/z_lab). Relationships: orientation g; registration; detector geometry; instrument pose. Shown separately below the chain: crystal_reciprocal (reciprocal, axes a*/b*/c*), dual to crystal.</desc>
  <defs>
    <marker id="pytex-chain-axis-0" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,0 L13,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="pytex-chain-axis-1" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,0 L13,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="pytex-chain-axis-2" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,0 L13,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="pytex-chain-rel" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 z" fill="#40506f"/>
    </marker>
    <marker id="pytex-chain-rel-dual" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="1432" height="610" fill="#fbfdff"/>
  <text x="40.0" y="46.0" font-size="25" font-family="Arial" fill="#07122f" text-anchor="start" font-family="Arial">PyTex Reference-Frame Chain</text>
  <text x="40.0" y="72.0" font-size="13" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">Crystal, specimen, map, detector, laboratory and reciprocal are distinct domains. The arrows name scientific relationships, not permission to collapse the frames.</text>
  <rect x="40.0" y="96.0" width="176.0" height="208.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.0"/>
  <text x="128.0" y="122.0" font-size="15" font-family="Arial" fill="#07122f" text-anchor="middle" font-family="Arial">crystal</text>
  <text x="128.0" y="140.0" font-size="11" font-family="Arial" fill="#40506f" text-anchor="middle" font-family="Arial">crystal · a/b/c</text>
    <line x1="128.00" y1="230.00" x2="128.00" y2="197.36" stroke="#dc2626" stroke-width="3.4" stroke-linecap="round" opacity="1" marker-end="url(#pytex-chain-axis-2)"/>
    <text x="128.00" y="186.80" font-size="12" font-family="Arial" fill="#dc2626" opacity="1" text-anchor="middle" dominant-baseline="middle" font-family="Arial">c</text>
    <line x1="128.00" y1="230.00" x2="157.18" y2="237.37" stroke="#059669" stroke-width="3.4" stroke-linecap="round" opacity="1" marker-end="url(#pytex-chain-axis-1)"/>
    <text x="167.42" y="239.96" font-size="12" font-family="Arial" fill="#059669" opacity="1" text-anchor="middle" dominant-baseline="middle" font-family="Arial">b</text>
    <line x1="128.00" y1="230.00" x2="108.32" y2="240.93" stroke="#1d4ed8" stroke-width="3.4" stroke-linecap="round" opacity="1" marker-end="url(#pytex-chain-axis-0)"/>
    <text x="99.08" y="246.06" font-size="12" font-family="Arial" fill="#1d4ed8" opacity="1" text-anchor="middle" dominant-baseline="middle" font-family="Arial">a</text>
    <circle cx="128.00" cy="230.00" r="3.4" fill="#07122f"/>
  <text x="128.0" y="290.0" font-size="11" font-family="Arial" fill="#40506f" text-anchor="middle" font-family="Arial">lattice-fixed basis</text>
  <line x1="230.0" y1="200.0" x2="320.0" y2="200.0" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-chain-rel)"/>
  <text x="275.0" y="191.0" font-size="12" font-family="Arial" fill="#07122f" text-anchor="middle" font-family="Arial">orientation g</text>
  <rect x="334.0" y="96.0" width="176.0" height="208.0" rx="8" fill="#fdf6e8" stroke="#e6d4a8" stroke-width="1.0"/>
  <text x="422.0" y="122.0" font-size="15" font-family="Arial" fill="#07122f" text-anchor="middle" font-family="Arial">specimen</text>
