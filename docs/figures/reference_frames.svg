    <text x="99.08" y="518.06" font-size="12" font-family="Arial" fill="#1d4ed8" opacity="1" text-anchor="middle" dominant-baseline="middle" font-family="Arial">a*</text>
    <circle cx="128.00" cy="502.00" r="3.4" fill="#07122f"/>
  <text x="128.0" y="562.0" font-size="11" font-family="Arial" fill="#40506f" text-anchor="middle" font-family="Arial">dual basis, starred axes</text>
  <text x="240.0" y="472.0" font-size="12" font-family="Arial" fill="#7c3aed" text-anchor="start" font-family="Arial">Crystal geometry is also expressible in the reciprocal basis a*, b*, c*. The star marks the basis, never the Miller indices: (hkl) are already reciprocal-basis components.</text>
