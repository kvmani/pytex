  <text x="422.0" y="290.0" font-size="11" font-family="Arial" fill="#40506f" text-anchor="middle" font-family="Arial">macroscopic sample frame</text>
  <line x1="524.0" y1="200.0" x2="614.0" y2="200.0" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-chain-rel)"/>
