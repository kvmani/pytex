    <line x1="422.00" y1="230.00" x2="422.00" y2="197.36" stroke="#dc2626" stroke-width="3.4" stroke-linecap="round" opacity="1" marker-end="url(#pytex-chain-axis-2)"/>
    <text x="422.00" y="186.80" font-size="12" font-family="Arial" fill="#dc2626" opacity="1" text-anchor="middle" dominant-baseline="middle" font-family="Arial">z</text>
    <line x1="422.00" y1="230.00" x2="451.18" y2="237.37" stroke="#059669" stroke-width="3.4" stroke-linecap="round" opacity="1" marker-end="url(#pytex-chain-axis-1)"/>
    <text x="461.42" y="239.96" font-size="12" font-family="Arial" fill="#059669" opacity="1" text-anchor="middle" dominant-baseline="middle" font-family="Arial">y</text>
    <line x1="422.00" y1="230.00" x2="402.32" y2="240.93" stroke="#1d4ed8" stroke-width="3.4" stroke-linecap="round" opacity="1" marker-end="url(#pytex-chain-axis-0)"/>
    <text x="393.08" y="246.06" font-size="12" font-family="Arial" fill="#1d4ed8" opacity="1" text-anchor="middle" dominant-baseline="middle" font-family="Arial">x</text>
