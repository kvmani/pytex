  <text x="1010.0" y="290.0" font-size="11" font-family="Arial" fill="#40506f" text-anchor="middle" font-family="Arial">pattern-plane coordinates</text>
  <line x1="1112.0" y1="200.0" x2="1202.0" y2="200.0" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-chain-rel)"/>
