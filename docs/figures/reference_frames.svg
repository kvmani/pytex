    <line x1="716.00" y1="230.00" x2="716.00" y2="197.36" stroke="#dc2626" stroke-width="3.4" stroke-linecap="round" opacity="1" marker-end="url(#pytex-chain-axis-2)"/>
    <text x="716.00" y="186.80" font-size="12" font-family="Arial" fill="#dc2626" opacity="1" text-anchor="middle" dominant-baseline="middle" font-family="Arial">z</text>
    <line x1="716.00" y1="230.00" x2="745.18" y2="237.37" stroke="#059669" stroke-width="3.4" stroke-linecap="round" opacity="1" marker-end="url(#pytex-chain-axis-1)"/>
    <text x="755.42" y="239.96" font-size="12" font-family="Arial" fill="#059669" opacity="1" text-anchor="middle" dominant-baseline="middle" font-family="Arial">y</text>
    <line x1="716.00" y1="230.00" x2="696.32" y2="240.93" stroke="#1d4ed8" stroke-width="3.4" stroke-linecap="round" opacity="1" marker-end="url(#pytex-chain-axis-0)"/>
    <text x="687.08" y="246.06" font-size="12" font-family="Arial" fill="#1d4ed8" opacity="1" text-anchor="middle" dominant-baseline="middle" font-family="Arial">x</text>
    <circle cx="716.00" cy="230.00" r="3.4" fill="#07122f"/>
  <text x="716.0" y="290.0" font-size="11" font-family="Arial" fill="#40506f" text-anchor="middle" font-family="Arial">scan sampling grid</text>
  <line x1="818.0" y1="200.0" x2="908.0" y2="200.0" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-chain-rel)"/>
  <text x="863.0" y="191.0" font-size="12" font-family="Arial" fill="#07122f" text-anchor="middle" font-family="Arial">detector geometry</text>
  <rect x="922.0" y="96.0" width="176.0" height="208.0" rx="8" fill="#eaf4fb" stroke="#b3d5ea" stroke-width="1.0"/>
  <text x="1010.0" y="122.0" font-size="15" font-family="Arial" fill="#07122f" text-anchor="middle" font-family="Arial">detector</text>
  <text x="1010.0" y="140.0" font-size="11" font-family="Arial" fill="#40506f" text-anchor="middle" font-family="Arial">detector · u/v/n</text>
    <line x1="1010.00" y1="230.00" x2="1010.00" y2="197.36" stroke="#dc2626" stroke-width="3.4" stroke-linecap="round" opacity="1" marker-end="url(#pytex-chain-axis-2)"/>
