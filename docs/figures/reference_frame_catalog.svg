<svg xmlns="http://www.w3.org/2000/svg" width="1172" height="638" viewBox="0 0 1172 638" role="img">
  <title>PyTex Standard Reference Frames</title>
  <desc>One panel per catalog frame. Axis vectors are components in the canonical Cartesian reference; all panels share one viewing direction. Frames shown: cartesian (laboratory): axes X, Y, Z; specimen (specimen): axes x, y, z; sample_rd_td_nd (specimen): axes RD, TD, ND; crystal (crystal): axes a, b, c; map (map): axes x, y, z; detector (detector): axes u, v, n; laboratory (laboratory): axes x_lab, y_lab, z_lab.</desc>
