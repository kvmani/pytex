<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">PyTex System Structure</title>
  <desc id="desc">Layered architecture map showing governance, canonical core, domain modules, boundary layers, and next foundations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#f5f3ff"/><stop offset="1" stop-color="#ddd6fe"/></linearGradient>
    <linearGradient id="teal" x1="0" x2="1"><stop stop-color="#ecfeff"/><stop offset="1" stop-color="#a5f3fc"/></linearGradient>
    <linearGradient id="amber" x1="0" x2="1"><stop stop-color="#fffbeb"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
    <linearGradient id="rose" x1="0" x2="1"><stop stop-color="#fff1f2"/><stop offset="1" stop-color="#fecdd3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#07122f" flood-opacity="0.14"/></filter>
    <marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="24.00" markerHeight="24.00" refX="20.00" refY="12.00" orient="auto"><path d="M4.00,4.00 L20.00,12.00 L4.00,20.00 Z" fill="#07122f"/></marker>
    <style>
      .title{font: 700 42px Arial;fill:#07122f}.subtitle{font: 20px Arial;fill:#40506f}.label{font: 700 20px Arial;fill:#07122f}.body{font: 15px Arial;fill:#40506f}.lane{fill:#fbfdff;stroke-dasharray:5 5;stroke-width:1.5}.card{rx:8;filter:url(#shadow);stroke-width:2}.arrow{fill:none;stroke:#07122f;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#7c3aed;stroke-width:2.5;stroke-dasharray:7 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <text x="600" y="62" text-anchor="middle" class="title">PyTex System Structure</text>
  <text x="600" y="96" text-anchor="middle" class="subtitle">Governed scientific architecture with one canonical crystallographic core</text>
  <rect x="510" y="118" width="180" height="5" rx="3" fill="#2563eb"/><rect x="600" y="118" width="90" height="5" rx="3" fill="#7c3aed"/>

  <rect x="48" y="150" width="1104" height="108" rx="18" class="lane" stroke="#7c3aed"/>
  <text x="70" y="180" class="label" fill="#7c3aed">Governance And Evidence</text>
  <rect x="84" y="202" width="250" height="82.4" class="card" fill="url(#violet)" stroke="#7c3aed"/>
  <text x="112" y="232" class="label">Mission + Standards</text><text x="112" y="254" class="body"><tspan x="112" dy="0.0">notation, reference canon,</tspan><tspan x="112" dy="19.2">manifests</tspan></text>
  <rect x="474" y="202" width="267.6" height="82.4" class="card" fill="url(#violet)" stroke="#7c3aed"/>
  <text x="502" y="232" class="label">Documentation Surface</text><text x="502" y="254" class="body"><tspan x="502" dy="0.0">Sphinx, LaTeX notes, SVG</tspan><tspan x="502" dy="19.2">figures</tspan></text>
  <rect x="864" y="202" width="250" height="82.4" class="card" fill="url(#teal)" stroke="#0f9f9f"/>
  <text x="892" y="232" class="label">Validation Surface</text><text x="892" y="254" class="body"><tspan x="892" dy="0.0">tests, parity ledgers,</tspan><tspan x="892" dy="19.2">benchmarks</tspan></text>

  <rect x="48" y="318" width="1104" height="154" rx="18" class="lane" stroke="#2563eb"/>
  <text x="70" y="348" class="label" fill="#2563eb">Canonical Core</text>
  <rect x="86" y="374" width="150" height="72" class="card" fill="url(#blue)" stroke="#2563eb"/><text x="161" y="405" text-anchor="middle" class="label">Conventions</text><text x="161" y="429" text-anchor="middle" class="body">frame domains</text>
  <rect x="266" y="374" width="150" height="72" class="card" fill="url(#blue)" stroke="#2563eb"/><text x="341" y="405" text-anchor="middle" class="label">Frames</text><text x="341" y="429" text-anchor="middle" class="body">transforms</text>
  <rect x="446" y="374" width="150" height="72" class="card" fill="url(#blue)" stroke="#2563eb"/><text x="521" y="405" text-anchor="middle" class="label">Symmetry</text><text x="521" y="429" text-anchor="middle" class="body">operators</text>
  <rect x="626" y="374" width="150" height="72" class="card" fill="url(#blue)" stroke="#2563eb"/><text x="701" y="405" text-anchor="middle" class="label">Lattice</text><text x="701" y="429" text-anchor="middle" class="body">phase + basis</text>
  <rect x="806" y="374" width="150" height="72" class="card" fill="url(#blue)" stroke="#2563eb"/><text x="881" y="405" text-anchor="middle" class="label">Orientation</text><text x="881" y="429" text-anchor="middle" class="body">rotation semantics</text>
  <rect x="986" y="374" width="127.1" height="72" class="card" fill="url(#blue)" stroke="#2563eb"/><text x="1046" y="405" text-anchor="middle" class="label">Provenance</text><text x="1046" y="429" text-anchor="middle" class="body">traceability</text>

  <rect x="66" y="530" width="630" height="144" rx="18" class="lane" stroke="#16a34a"/>
  <text x="88" y="560" class="label" fill="#16a34a">Domain Modules</text>
  <rect x="102" y="584" width="130" height="68" class="card" fill="#ecfdf5" stroke="#16a34a"/><text x="167" y="622" text-anchor="middle" class="label">Texture</text>
  <rect x="258" y="584" width="130" height="68" class="card" fill="#ecfdf5" stroke="#16a34a"/><text x="323" y="622" text-anchor="middle" class="label">EBSD</text>
  <rect x="414" y="584" width="130" height="68" class="card" fill="#ecfdf5" stroke="#16a34a"/><text x="479" y="622" text-anchor="middle" class="label">Diffraction</text>
  <rect x="570" y="584" width="96" height="68" class="card" fill="#ecfdf5" stroke="#16a34a"/><text x="618" y="622" text-anchor="middle" class="label">Plotting</text>

  <rect x="742" y="530" width="390" height="144" rx="18" class="lane" stroke="#f59e0b"/>
  <text x="764" y="560" class="label" fill="#f59e0b">Boundary And Growth</text>
  <rect x="778" y="584" width="146" height="68" class="card" fill="url(#amber)" stroke="#f59e0b"/><text x="851" y="613" text-anchor="middle" class="label">Adapters</text><text x="851" y="635" text-anchor="middle" class="body">normalize inputs</text>
  <rect x="958" y="584" width="228.0" height="81.5" class="card" fill="url(#rose)" stroke="#e11d48"/><text x="1031" y="613" text-anchor="middle" class="label">Next Foundations</text><text x="1031" y="635" text-anchor="middle" class="body"><tspan x="1031" dy="0.0">multimodal +</tspan><tspan x="1031" dy="19.2">transform</tspan></text>

  <path class="arrow" d="M209 276 V360"/><path class="arrow" d="M599 276 V360"/><path class="arrow" d="M989 276 V360"/>
  <path class="arrow" d="M236 410 H266"/><path class="arrow" d="M416 410 H446"/><path class="arrow" d="M596 410 H626"/><path class="arrow" d="M776 410 H806"/><path class="arrow" d="M956 410 H986"/>
  <path class="arrow" d="M881 446 C830 510 520 518 479 584"/><path class="arrow" d="M701 446 C630 510 360 520 323 584"/><path class="arrow" d="M521 446 C470 508 220 520 167 584"/>
  <path class="arrow" d="M701 446 C760 514 830 520 851 584"/><path class="dash" d="M881 446 C940 510 1010 520 1031 584"/>
</svg>


