<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">PyTex Scientific Data Flow</title>
  <desc id="desc">Two-lane data flow showing external sources normalized through adapters into canonical objects, domain workflows, scientific outputs, documentation, and validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#07122f" flood-opacity="0.14"/></filter>
    <marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="24.00" markerHeight="24.00" refX="20.00" refY="12.00" orient="auto"><path d="M4.00,4.00 L20.00,12.00 L4.00,20.00 Z" fill="#07122f"/></marker>
    <marker markerUnits="userSpaceOnUse" id="blueArrow" markerWidth="24.00" markerHeight="24.00" refX="20.00" refY="12.00" orient="auto"><path d="M4.00,4.00 L20.00,12.00 L4.00,20.00 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family: Arial;font-weight:700;fill:#07122f}.subtitle{font-size:20px;fill:#40506f}
      .label{font-size:18px;font-weight:700;fill:#07122f}.body{font-size:14px;fill:#40506f}
      .small{font-size:13px;fill:#40506f}.card{rx:8;filter:url(#shadow);stroke-width:2}
      .lane{fill:#fbfdff;stroke-width:1.5;stroke-dasharray:5 5}
      .arrow{fill:none;stroke:#07122f;stroke-width:2.6;marker-end:url(#arrow)}
      .evidence{fill:none;stroke:#2563eb;stroke-width:2.4;stroke-dasharray:7 7;marker-end:url(#blueArrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="600" y="62" text-anchor="middle" class="title">Scientific Data Flow</text>
  <text x="600" y="96" text-anchor="middle" class="subtitle">Normalize once, compute on canonical objects, publish traceable outputs</text>
  <rect x="510" y="118" width="180" height="5" rx="3" fill="#2563eb"/>
  <rect x="600" y="118" width="90" height="5" rx="3" fill="#7c3aed"/>

  <rect x="58" y="158" width="1084" height="252" rx="18" class="lane" stroke="#2563eb"/>
  <text x="84" y="190" class="label" fill="#2563eb">Primary Data Path</text>

  <rect x="80" y="226" width="176" height="124" class="card" fill="#f8fafc" stroke="#40506f"/>
  <circle cx="168" cy="264" r="24" fill="#e2e8f0"/><text x="168" y="272" text-anchor="middle" class="label">1</text>
  <text x="168" y="304" text-anchor="middle" class="label">External Sources</text>
  <text x="168" y="328" text-anchor="middle" class="body">EBSD, CIF, adapters</text>

  <rect x="300" y="226" width="176" height="124" class="card" fill="#fffbeb" stroke="#f59e0b"/>
  <circle cx="388" cy="264" r="24" fill="#fef3c7"/><text x="388" y="272" text-anchor="middle" class="label">2</text>
  <text x="388" y="304" text-anchor="middle" class="label">Boundary</text>
  <text x="388" y="328" text-anchor="middle" class="body">validate manifests</text>

  <rect x="520" y="226" width="176.6" height="124" class="card" fill="#eff6ff" stroke="#2563eb"/>
  <circle cx="608" cy="264" r="24" fill="#dbeafe"/><text x="608" y="272" text-anchor="middle" class="label">3</text>
  <text x="608" y="304" text-anchor="middle" class="label">Canonical Core</text>
  <text x="608" y="328" text-anchor="middle" class="body">frames, phase, symmetry</text>

  <rect x="740" y="226" width="176.6" height="124" class="card" fill="#ecfdf5" stroke="#16a34a"/>
  <circle cx="828" cy="264" r="24" fill="#dcfce7"/><text x="828" y="272" text-anchor="middle" class="label">4</text>
  <text x="828" y="304" text-anchor="middle" class="label">Workflows</text>
  <text x="828" y="328" text-anchor="middle" class="body">texture, EBSD, diffraction</text>

  <rect x="960" y="226" width="156" height="124" class="card" fill="#f5f3ff" stroke="#7c3aed"/>
  <circle cx="1038" cy="264" r="24" fill="#ede9fe"/><text x="1038" y="272" text-anchor="middle" class="label">5</text>
  <text x="1038" y="304" text-anchor="middle" class="label">Outputs</text>
  <text x="1038" y="328" text-anchor="middle" class="body">reports, figures</text>
  <text x="1038" y="346" text-anchor="middle" class="body">JSON contracts</text>

  <path class="arrow" d="M256 288 H300"/><path class="arrow" d="M476 288 H520"/>
  <path class="arrow" d="M696 288 H740"/><path class="arrow" d="M916 288 H960"/>

  <rect x="58" y="462" width="1084" height="160" rx="18" class="lane" stroke="#7c3aed"/>
  <text x="84" y="494" class="label" fill="#7c3aed">Evidence And Explanation Path</text>

  <rect x="112" y="524" width="282" height="76" class="card" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="253" y="554" text-anchor="middle" class="label">Documentation + Theory</text>
  <text x="253" y="578" text-anchor="middle" class="body">concepts, workflows, LaTeX, SVG</text>

  <rect x="459" y="524" width="282" height="76" class="card" fill="#ecfeff" stroke="#0f9f9f"/>
  <text x="600" y="554" text-anchor="middle" class="label">Validation + Reproducibility</text>
  <text x="600" y="578" text-anchor="middle" class="body">tests, fixtures, parity, manifests</text>

  <rect x="806" y="524" width="282" height="76" class="card" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="947" y="554" text-anchor="middle" class="label">Traceable Claims</text>
  <text x="947" y="578" text-anchor="middle" class="body">implemented versus foundational</text>

  <path class="evidence" d="M253 524 C310 430 526 400 608 350"/>
  <path class="evidence" d="M600 524 C650 430 790 400 828 350"/>
  <path class="evidence" d="M947 524 C992 430 1020 400 1038 350"/>

  <rect x="150" y="656" width="900" height="50.2" rx="17" fill="#ffffff" stroke="#dbe4f0"/>
  <circle cx="188" cy="673" r="6" fill="#07122f"/><text x="206" y="679" class="small">solid arrows: canonical data movement</text>
  <circle cx="480" cy="673" r="6" fill="#2563eb"/><text x="498" y="679" class="small">dashed arrows: documentation and validation constraints</text>
  <circle cx="874" cy="673" r="6" fill="#16a34a"/><text x="892" y="679" class="small"><tspan x="892" dy="0.0">green: evidence-backed</tspan><tspan x="892" dy="16.6">outputs</tspan></text>
</svg>

