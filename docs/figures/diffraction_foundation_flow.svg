<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">PyTex Diffraction Foundation Flow</title>
  <desc id="desc">Diffraction foundation workflow showing canonical core objects feeding diffraction geometry, reciprocal-space semantics, kinematic spots, indexing, and validation notes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#07122f" flood-opacity="0.14"/></filter>
    <marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="24.00" markerHeight="24.00" refX="20.00" refY="12.00" orient="auto"><path d="M4.00,4.00 L20.00,12.00 L4.00,20.00 Z" fill="#07122f"/></marker>
    <style>.title{font:700 38px Arial, Helvetica, sans-serif;fill:#07122f}.subtitle{font:19px Arial, Helvetica, sans-serif;fill:#40506f}.label{font:700 20px Arial, Helvetica, sans-serif;fill:#07122f}.body{font:15px Arial, Helvetica, sans-serif;fill:#40506f}.card{rx:8;filter:url(#shadow);stroke-width:2}.arrow{fill:none;stroke:#07122f;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#7c3aed;stroke-width:2.4;stroke-dasharray:7 7;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1100" height="650" fill="url(#bg)"/>
  <text x="550" y="58" text-anchor="middle" class="title">Diffraction Foundation Flow</text>
  <text x="550" y="90" text-anchor="middle" class="subtitle">Detector, laboratory, and reciprocal semantics stay explicit through simulation and indexing</text>
  <rect x="470" y="112" width="160" height="5" rx="3" fill="#2563eb"/><rect x="550" y="112" width="80" height="5" rx="3" fill="#7c3aed"/>

  <rect x="70" y="270" width="190" height="96" class="card" fill="#eff6ff" stroke="#2563eb"/>
  <text x="100" y="305" class="label">Canonical Core</text><text x="100" y="330" class="body"><tspan x="100" dy="0.0">phase, lattice,</tspan><tspan x="100" dy="19.2">orientation</tspan></text>
  <rect x="330" y="160" width="230.3" height="96" class="card" fill="#ecfeff" stroke="#0f9f9f"/>
  <text x="360" y="195" class="label">DiffractionGeometry</text><text x="360" y="220" class="body">Reciprocal Space</text>
  <rect x="330" y="380" width="213.7" height="96" class="card" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="360" y="415" class="label">Reciprocal Space</text><text x="360" y="440" class="body"><tspan x="360" dy="0.0">planes, vectors, zone</tspan><tspan x="360" dy="19.2">axes</tspan></text>
  <rect x="602" y="160" width="190" height="96" class="card" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="632" y="195" class="label">Powder XRD</text><text x="632" y="220" class="body"><tspan x="632" dy="0.0">reflections and</tspan><tspan x="632" dy="19.2">spectrum</tspan></text>
  <rect x="602" y="380" width="190" height="96" class="card" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="632" y="415" class="label">SAED Spots</text><text x="632" y="440" class="body"><tspan x="632" dy="0.0">families and</tspan><tspan x="632" dy="19.2">acceptance masks</tspan></text>
  <rect x="858" y="270" width="228.0" height="96" class="card" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="888" y="305" class="label">Indexing + Evidence</text><text x="888" y="330" class="body"><tspan x="888" dy="0.0">ranking, refinement,</tspan><tspan x="888" dy="19.2">validation</tspan></text>

  <path class="arrow" d="M260 318 C300 280 306 218 330 208"/>
  <path class="arrow" d="M260 318 C300 356 306 418 330 428"/>
  <path class="arrow" d="M520 208 H602"/>
  <path class="arrow" d="M520 428 H602"/>
  <path class="arrow" d="M520 208 C562 245 584 350 602 428"/>
  <path class="arrow" d="M520 428 C562 390 584 280 602 208"/>
  <path class="arrow" d="M792 208 C840 230 850 284 858 304"/>
  <path class="arrow" d="M792 428 C840 406 850 352 858 332"/>
  <path class="dash" d="M945 366 C920 505 500 540 425 476"/>
</svg>


