<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">PyTex Core Foundation Map</title>
  <desc id="desc">Core foundation diagram showing conventions, frames, symmetry, lattice, orientation, and provenance as the semantic nucleus used by downstream subsystems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#07122f" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#07122f"/></marker>
    <style>.title{font:700 38px Arial, Helvetica, sans-serif;fill:#07122f}.subtitle{font:19px Arial, Helvetica, sans-serif;fill:#40506f}.label{font:700 20px Arial, Helvetica, sans-serif;fill:#07122f}.body{font:15px Arial, Helvetica, sans-serif;fill:#40506f}.card{rx:8;filter:url(#shadow);stroke-width:2}.arrow{fill:none;stroke:#07122f;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1100" height="650" fill="url(#bg)"/>
  <text x="550" y="58" text-anchor="middle" class="title">Core Foundation Map</text>
  <text x="550" y="90" text-anchor="middle" class="subtitle">The shared semantic model beneath texture, EBSD, diffraction, and plotting</text>
  <rect x="470" y="112" width="160" height="5" rx="3" fill="#2563eb"/><rect x="550" y="112" width="80" height="5" rx="3" fill="#7c3aed"/>

  <rect x="424" y="245" width="252" height="122" class="card" fill="#eff6ff" stroke="#2563eb"/>
  <circle cx="470" cy="306" r="28" fill="#dbeafe"/><text x="470" y="315" text-anchor="middle" class="label">C</text>
  <text x="516" y="292" class="label">Canonical Core</text><text x="516" y="317" class="body">explicit scientific semantics</text><text x="516" y="339" class="body">no private frame model</text>

  <rect x="88" y="164" width="220" height="90" class="card" fill="#f5f3ff" stroke="#7c3aed"/><text x="120" y="198" class="label">Conventions</text><text x="120" y="223" class="body">frame domains, Euler labels, basis</text>
  <rect x="88" y="390" width="220" height="90" class="card" fill="#ecfeff" stroke="#0f9f9f"/><text x="120" y="424" class="label">Reference Frames</text><text x="120" y="449" class="body">named domains and transforms</text>
  <rect x="440" y="500" width="220" height="90" class="card" fill="#ecfdf5" stroke="#16a34a"/><text x="472" y="534" class="label">Symmetry</text><text x="472" y="559" class="body">operators and fundamental sectors</text>
  <rect x="792" y="390" width="220" height="90" class="card" fill="#fffbeb" stroke="#f59e0b"/><text x="824" y="424" class="label">Lattice + Phase</text><text x="824" y="449" class="body">basis, unit cell, Miller objects</text>
  <rect x="792" y="164" width="220" height="90" class="card" fill="#eff6ff" stroke="#2563eb"/><text x="824" y="198" class="label">Orientation</text><text x="824" y="223" class="body">rotation, mapping, misorientation</text>
  <rect x="440" y="54" width="220" height="90" class="card" fill="#fff1f2" stroke="#e11d48"/><text x="472" y="88" class="label">Provenance</text><text x="472" y="113" class="body">source and normalization trace</text>

  <path class="arrow" d="M308 209 C360 218 392 246 424 282"/>
  <path class="arrow" d="M308 435 C360 426 392 366 424 330"/>
  <path class="arrow" d="M550 500 V367"/>
  <path class="arrow" d="M792 435 C740 426 708 366 676 330"/>
  <path class="arrow" d="M792 209 C740 218 708 246 676 282"/>
  <path class="arrow" d="M550 144 V245"/>
</svg>


