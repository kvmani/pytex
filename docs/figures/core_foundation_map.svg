<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">PyTex Core Foundation Map</title>
  <desc id="desc">Core foundation diagram showing conventions, frames, symmetry, lattice, orientation, and provenance as the semantic nucleus used by downstream subsystems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#07122f" flood-opacity="0.14"/></filter>
    <marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="24.00" markerHeight="24.00" refX="20.00" refY="12.00" orient="auto"><path d="M4.00,4.00 L20.00,12.00 L4.00,20.00 Z" fill="#07122f"/></marker>
    <style>.title{font: 700 38px Arial;fill:#07122f}.subtitle{font: 19px Arial;fill:#40506f}.label{font: 700 20px Arial;fill:#07122f}.body{font: 15px Arial;fill:#40506f}.card{rx:8;filter:url(#shadow);stroke-width:2}.arrow{fill:none;stroke:#07122f;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1100" height="650" fill="url(#bg)"/>
  <text x="48" y="58" class="title">Core Foundation Map</text>
  <text x="48" y="90" class="subtitle">The shared semantic model beneath texture, EBSD, diffraction, and plotting</text>
  <rect x="470" y="112" width="183.5" height="5" rx="3" fill="#2563eb"/><rect x="550" y="112" width="107.2" height="5" rx="3" fill="#7c3aed"/>

  <rect x="424" y="245" width="252" height="122" class="card" fill="#eff6ff" stroke="#2563eb"/>
  <circle cx="470" cy="306" r="28" fill="#dbeafe"/><text x="470" y="315" text-anchor="middle" class="label">C</text>
  <text x="516" y="292" class="label">Canonical Core</text><text x="516" y="317" class="body"><tspan x="516" dy="0.0">explicit scientific</tspan><tspan x="516" dy="19.2">semantics, no private</tspan><tspan x="516" dy="19.2">frame model</tspan></text>

  <rect x="88" y="164" width="220" height="90" class="card" fill="#f5f3ff" stroke="#7c3aed"/><text x="120" y="198" class="label">Conventions</text><text x="120" y="223" class="body"><tspan x="120" dy="0.0">frame domains, Euler</tspan><tspan x="120" dy="19.2">labels, basis</tspan></text>
  <rect x="88" y="390" width="220" height="90" class="card" fill="#ecfeff" stroke="#0f9f9f"/><text x="120" y="424" class="label">Reference Frames</text><text x="120" y="449" class="body"><tspan x="120" dy="0.0">named domains and</tspan><tspan x="120" dy="19.2">transforms</tspan></text>
  <rect x="440" y="500" width="220" height="90" class="card" fill="#ecfdf5" stroke="#16a34a"/><text x="472" y="534" class="label">Symmetry</text><text x="472" y="559" class="body"><tspan x="472" dy="0.0">operators and</tspan><tspan x="472" dy="19.2">fundamental sectors</tspan></text>
  <rect x="792" y="390" width="220" height="90" class="card" fill="#fffbeb" stroke="#f59e0b"/><text x="824" y="424" class="label">Lattice + Phase</text><text x="824" y="449" class="body"><tspan x="824" dy="0.0">basis, unit cell, Miller</tspan><tspan x="824" dy="19.2">objects</tspan></text>
  <rect x="792" y="164" width="220" height="90" class="card" fill="#eff6ff" stroke="#2563eb"/><text x="824" y="198" class="label">Orientation</text><text x="824" y="223" class="body"><tspan x="824" dy="0.0">rotation, mapping,</tspan><tspan x="824" dy="19.2">misorientation</tspan></text>
  <rect x="440" y="140" width="220" height="90" class="card" fill="#fff1f2" stroke="#e11d48"/><text x="472" y="174" class="label">Provenance</text><text x="472" y="199" class="body"><tspan x="472" dy="0.0">source and</tspan><tspan x="472" dy="19.2">normalization trace</tspan></text>

  <path class="arrow" d="M308 209 C360 218 392 246 424 282"/>
  <path class="arrow" d="M308 435 C360 426 392 366 424 330"/>
  <path class="arrow" d="M550 500 V367"/>
  <path class="arrow" d="M792 435 C740 426 708 366 676 330"/>
  <path class="arrow" d="M792 209 C740 218 708 246 676 282"/>
  <path class="arrow" d="M550 144 V245"/>
</svg>


