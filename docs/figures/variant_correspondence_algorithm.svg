<svg xmlns="http://www.w3.org/2000/svg" width="1196" height="1108" viewBox="0 0 1196 1108" role="img">
  <title>Variant-Resolved Plane And Direction Correspondence</title>
  <desc>Three-lane flow sheet. Lane 1 takes the nominated crystallographic object and the variant set. Lane 2 maps each object through each variant on the correct basis, rationalizes the generally irrational image to the nearest primitive integer triple by true angle, and groups variants whose images are symmetry-equivalent. Lane 3 emits the table, the exactly-parallel subset that carries the physics, and the export surfaces. Side notes give the constraint governing each stage.</desc>
  <defs>
    <marker id="pytex-algo-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 z" fill="#40506f"/>
    </marker>
    <marker id="pytex-algo-arrow-flow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1196" height="1108" fill="#fbfdff"/>
  <text x="40.0" y="46.0" font-size="25" font-family="Arial" fill="#07122f" text-anchor="start" font-family="Arial">Variant-Resolved Plane And Direction Correspondence</text>
  <text x="40.0" y="72.0" font-size="13" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">variant_correspondence_table: what one parent (hkl) or [uvw] becomes in every product variant, grouped so the answer is readable.</text>
  <text x="40.0" y="96.0" font-size="13" font-family="Arial" fill="#7c3aed" text-anchor="start" font-family="Arial">1 - the object and the variants</text>
  <rect x="40.0" y="108.0" width="236.0" height="178.0" rx="8" fill="#eef7f0" stroke="#a7ccb4" stroke-width="1.4"/>
  <text x="54.0" y="135.0" font-size="15" font-family="Arial" fill="#124a2a" text-anchor="start" font-weight="bold" font-family="Arial">Nominated object</text>
  <text x="54.0" y="157.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start" font-family="Arial">(hkl) or [uvw] in one phase</text>
  <text x="54.0" y="176.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">One or many, all of one kind.</text>
  <text x="54.0" y="192.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">Sense chooses parent-&gt;child or</text>
  <text x="54.0" y="208.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">child-&gt;parent.</text>
  <rect x="310.0" y="108.0" width="236.0" height="178.0" rx="8" fill="#eef7f0" stroke="#a7ccb4" stroke-width="1.4"/>
  <text x="324.0" y="135.0" font-size="15" font-family="Arial" fill="#124a2a" text-anchor="start" font-weight="bold" font-family="Arial">Variant set</text>
  <text x="324.0" y="157.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start" font-family="Arial">V_k = R S_p,k, reduced by G_c</text>
  <text x="324.0" y="176.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">Parent operators generate</text>
  <text x="324.0" y="192.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">candidates;</text>
  <text x="324.0" y="208.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">the child-symmetry orbit</text>
  <text x="324.0" y="224.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">defines</text>
  <text x="324.0" y="240.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">distinctness. KS 24, Burgers</text>
  <text x="324.0" y="256.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">12.</text>
  <line x1="276.0" y1="197.0" x2="306.0" y2="197.0" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <line x1="158.0" y1="286.0" x2="158.0" y2="326.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#pytex-algo-arrow-flow)"/>
  <text x="40.0" y="320.0" font-size="13" font-family="Arial" fill="#7c3aed" text-anchor="start" font-family="Arial">2 - map each object through each variant</text>
  <rect x="40.0" y="332.0" width="236.0" height="213.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="54.0" y="359.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold" font-family="Arial">Exact image</text>
  <text x="54.0" y="381.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start" font-family="Arial">h_c = A_c*^-1 V_k A_p* h_p</text>
  <text x="54.0" y="400.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">Planes ride the reciprocal</text>
  <text x="54.0" y="416.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">basis,</text>
  <text x="54.0" y="432.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">directions the direct basis, so</text>
  <text x="54.0" y="448.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">the</text>
  <text x="54.0" y="464.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">zone law h.u is preserved.</text>
  <text x="54.0" y="480.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">The image is generally</text>
  <text x="54.0" y="496.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">irrational.</text>
  <rect x="310.0" y="332.0" width="236.0" height="213.0" rx="8" fill="#fdf6e8" stroke="#e6d4a8" stroke-width="1.4"/>
  <text x="324.0" y="359.0" font-size="15" font-family="Arial" fill="#6b4a06" text-anchor="start" font-weight="bold" font-family="Arial">Rationalize</text>
  <text x="324.0" y="381.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start" font-family="Arial">argmin_t angle(A t, A</text>
  <text x="324.0" y="400.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start" font-family="Arial">h_exact)</text>
  <text x="324.0" y="419.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">Nearest primitive integer</text>
  <text x="324.0" y="435.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">triple, by</text>
  <text x="324.0" y="451.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">the true angle between</text>
  <text x="324.0" y="467.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">Cartesian</text>
  <text x="324.0" y="483.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">images. Sign-sensitive: the</text>
  <text x="324.0" y="499.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">triple</text>
  <text x="324.0" y="515.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">pointing along the image wins.</text>
  <line x1="276.0" y1="438.5" x2="306.0" y2="438.5" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <rect x="580.0" y="332.0" width="236.0" height="213.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="594.0" y="359.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold" font-family="Arial">Group by family</text>
  <text x="594.0" y="381.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start" font-family="Arial">orbit of the image under G</text>
  <text x="594.0" y="400.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">Variants whose images are</text>
  <text x="594.0" y="416.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">symmetry-</text>
  <text x="594.0" y="432.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">equivalent share an</text>
  <text x="594.0" y="448.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">equivalence-group</text>
  <text x="594.0" y="464.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">label, which is what turns 24</text>
  <text x="594.0" y="480.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">rows</text>
  <text x="594.0" y="496.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">into four distinct answers.</text>
  <line x1="546.0" y1="438.5" x2="576.0" y2="438.5" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <rect x="856.0" y="332.0" width="300.0" height="141.0" rx="8" fill="#f7faff" stroke="#c8d8f2" stroke-width="1.0"/>
  <text x="872.0" y="357.0" font-size="14" font-family="Arial" fill="#07122f" text-anchor="start" font-family="Arial">Constraint: basis by object kind</text>
  <text x="872.0" y="380.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">Using the direct basis for a plane is the</text>
  <text x="872.0" y="399.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">classic error. Plane indices are reciprocal-</text>
  <text x="872.0" y="418.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">basis components already; the library routes</text>
  <text x="872.0" y="437.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">every mapping through one pair of helpers so</text>
  <text x="872.0" y="456.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">the choice cannot be made per call site.</text>
  <rect x="856.0" y="487.0" width="300.0" height="160.0" rx="8" fill="#f7faff" stroke="#c8d8f2" stroke-width="1.0"/>
  <text x="872.0" y="512.0" font-size="14" font-family="Arial" fill="#07122f" text-anchor="start" font-family="Arial">Constraint: the index bound</text>
  <text x="872.0" y="535.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">max_index bounds the candidate triples.</text>
  <text x="872.0" y="554.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">Raising it never worsens a residual, and</text>
  <text x="872.0" y="573.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">never changes WHICH variants are exact -</text>
  <text x="872.0" y="592.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">only how the irrational images are labelled,</text>
  <text x="872.0" y="611.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">so 'four distinct images' is partly a</text>
  <text x="872.0" y="630.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">bookkeeping choice. describe() says so.</text>
  <line x1="158.0" y1="661.0" x2="158.0" y2="701.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#pytex-algo-arrow-flow)"/>
  <text x="40.0" y="695.0" font-size="13" font-family="Arial" fill="#7c3aed" text-anchor="start" font-family="Arial">3 - the table</text>
  <rect x="40.0" y="707.0" width="236.0" height="162.0" rx="8" fill="#f3eefc" stroke="#cdbdee" stroke-width="1.4"/>
  <text x="54.0" y="734.0" font-size="15" font-family="Arial" fill="#42227e" text-anchor="start" font-weight="bold" font-family="Arial">Rows with residuals</text>
  <text x="54.0" y="753.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">Per (object, variant): exact</text>
  <text x="54.0" y="769.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">components, integer indices,</text>
  <text x="54.0" y="785.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">the</text>
  <text x="54.0" y="801.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">angle between them, labels,</text>
  <text x="54.0" y="817.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">group.</text>
  <rect x="310.0" y="707.0" width="236.0" height="162.0" rx="8" fill="#f3eefc" stroke="#cdbdee" stroke-width="1.4"/>
  <text x="324.0" y="734.0" font-size="15" font-family="Arial" fill="#42227e" text-anchor="start" font-weight="bold" font-family="Arial">Exact subset</text>
  <text x="324.0" y="756.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start" font-family="Arial">residual &lt;= 1e-6 deg</text>
  <text x="324.0" y="775.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">The variants that really do</text>
  <text x="324.0" y="791.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">carry the</text>
  <text x="324.0" y="807.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">object onto that low-index</text>
  <text x="324.0" y="823.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">image -</text>
  <text x="324.0" y="839.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">the packet, physically.</text>
  <line x1="276.0" y1="788.0" x2="306.0" y2="788.0" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <rect x="580.0" y="707.0" width="236.0" height="162.0" rx="8" fill="#f3eefc" stroke="#cdbdee" stroke-width="1.4"/>
  <text x="594.0" y="734.0" font-size="15" font-family="Arial" fill="#42227e" text-anchor="start" font-weight="bold" font-family="Arial">Export</text>
  <text x="594.0" y="753.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">CSV, Markdown, records, JSON,</text>
  <text x="594.0" y="769.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">and a</text>
  <text x="594.0" y="785.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">describe() that states how many</text>
  <text x="594.0" y="801.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">distinct answers there are.</text>
  <line x1="546.0" y1="788.0" x2="576.0" y2="788.0" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <rect x="856.0" y="707.0" width="300.0" height="141.0" rx="8" fill="#f7faff" stroke="#c8d8f2" stroke-width="1.0"/>
  <text x="872.0" y="732.0" font-size="14" font-family="Arial" fill="#07122f" text-anchor="start" font-family="Arial">Result: the packet structure</text>
  <text x="872.0" y="755.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">Cubic: KS (111) gives 4 distinct images</text>
  <text x="872.0" y="774.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">across 24 variants, 6 each; the 6 exact ones</text>
  <text x="872.0" y="793.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">are {011} at zero residual - Morito's packet.</text>
  <text x="872.0" y="812.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">Hexagonal: Burgers (011)beta is basal in 2</text>
  <text x="872.0" y="831.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">of 12 - six packets of two.</text>
  <rect x="856.0" y="862.0" width="300.0" height="122.0" rx="8" fill="#f7faff" stroke="#c8d8f2" stroke-width="1.0"/>
  <text x="872.0" y="887.0" font-size="14" font-family="Arial" fill="#07122f" text-anchor="start" font-family="Arial">Asymmetry worth knowing</text>
  <text x="872.0" y="910.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">The reverse map is not selective: the child</text>
  <text x="872.0" y="929.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">(0001) maps back onto a {110} parent plane</text>
  <text x="872.0" y="948.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">in ALL 12 variants, because every variant's</text>
  <text x="872.0" y="967.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">basal plane came from some {110}.</text>
  <text x="40.0" y="1050.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">Rationalization is sign-sensitive by design, so the hexagonal basal image may be reported as (0001) or its antiparallel (000-1); both name the same plane.</text>
  <text x="40.0" y="1068.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start" font-family="Arial">Hexagonal phases are labelled in four-index Miller-Bravais form throughout.</text>
</svg>
