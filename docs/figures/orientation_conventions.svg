<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900">
  <defs>
    <marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="27.77" markerHeight="27.77" refX="20.83" refY="13.89" orient="auto">
      <path d="M0.00,0.00 L27.77,13.89 L0.00,27.77 z" fill="#203243"/>
    </marker>
    <marker markerUnits="userSpaceOnUse" id="arrow-crystal" markerWidth="20" markerHeight="20" refX="15" refY="10" orient="auto">
      <path d="M0.00,0.00 L20.00,10.00 L0.00,20.00 z" fill="#4b7a57"/>
    </marker>
    <marker markerUnits="userSpaceOnUse" id="arrow-specimen" markerWidth="20" markerHeight="20" refX="15" refY="10" orient="auto">
      <path d="M0.00,0.00 L20.00,10.00 L0.00,20.00 z" fill="#b58a2e"/>
    </marker>
    <marker markerUnits="userSpaceOnUse" id="arrow-seq" markerWidth="18" markerHeight="18" refX="13.5" refY="9" orient="auto">
      <path d="M0.00,0.00 L18.00,9.00 L0.00,18.00 z" fill="#1e4f3d"/>
    </marker>
  </defs>

  <rect width="1240" height="900" fill="#fcfaf5"/>

  <text x="54" y="58" font-size="32" font-family="Arial" fill="#193149" font-family="Arial">Orientation conventions</text>
  <text x="54" y="90" font-size="17" font-family="Arial" fill="#54616d" font-family="Arial">PyTex keeps orientation notation close to the standard texture-analysis references: right-handed frames,</text>
  <text x="54" y="114" font-size="17" font-family="Arial" fill="#54616d" font-family="Arial">Bunge Euler labels (phi1, Phi, phi2), explicit mapping direction, and canonical quaternion storage in (w, x, y, z).</text>

  <!-- Card 1: the typed mapping. Sized to hold both frame gizmos in full; the
       earlier layout let the arms and their labels run out of the card and
       collide with the heading above and the card below. -->
  <rect x="42" y="146" width="1156" height="392" rx="24" fill="#fffdf8" stroke="#d7d0c3" stroke-width="1.8"/>
  <text x="68" y="186" font-size="25" font-family="Arial" fill="#193149" font-family="Arial">1. Orientation is a typed crystal-to-specimen mapping</text>
  <text x="68" y="214" font-size="16" font-family="Arial" fill="#54616d" font-family="Arial">The matrix or quaternion is not self-explanatory on its own; the source frame,</text>
  <text x="68" y="236" font-size="16" font-family="Arial" fill="#54616d" font-family="Arial">target frame, and convention are part of the meaning.</text>

  <g transform="translate(230,352)">
    <circle cx="0" cy="0" r="4" fill="#1e2937"/>
    <line x1="0" y1="0" x2="110" y2="-14" stroke="#4b7a57" stroke-width="4" marker-end="url(#arrow-crystal)"/>
    <line x1="0" y1="0" x2="-36" y2="-88" stroke="#4b7a57" stroke-width="4" marker-end="url(#arrow-crystal)"/>
    <line x1="0" y1="0" x2="22" y2="92" stroke="#4b7a57" stroke-width="4" marker-end="url(#arrow-crystal)"/>
    <text x="128" y="-10" font-size="24" font-family="Arial" fill="#22402b" font-family="Arial">a</text>
    <text x="-56" y="-96" font-size="24" font-family="Arial" fill="#22402b" font-family="Arial">b</text>
    <text x="36" y="116" font-size="24" font-family="Arial" fill="#22402b" font-family="Arial">c</text>
    <text x="0" y="148" font-size="23" font-family="Arial" fill="#22402b" text-anchor="middle" font-family="Arial">crystal frame</text>
  </g>

  <g transform="translate(700,352)">
    <circle cx="0" cy="0" r="4" fill="#1e2937"/>
    <line x1="0" y1="0" x2="112" y2="-10" stroke="#b58a2e" stroke-width="4" marker-end="url(#arrow-specimen)"/>
    <line x1="0" y1="0" x2="-58" y2="-76" stroke="#b58a2e" stroke-width="4" marker-end="url(#arrow-specimen)"/>
    <line x1="0" y1="0" x2="0" y2="100" stroke="#b58a2e" stroke-width="4" marker-end="url(#arrow-specimen)"/>
    <text x="130" y="-6" font-size="24" font-family="Arial" fill="#5a4109" font-family="Arial">x</text>
    <text x="-80" y="-84" font-size="24" font-family="Arial" fill="#5a4109" font-family="Arial">y</text>
    <text x="14" y="124" font-size="24" font-family="Arial" fill="#5a4109" font-family="Arial">z</text>
    <text x="0" y="156" font-size="23" font-family="Arial" fill="#5a4109" text-anchor="middle" font-family="Arial">specimen frame</text>
  </g>

  <!-- The mapping arc and its caption sit in the clear channel between the two
       gizmos, so neither runs across an axis arm or an axis label. -->
  <path d="M368 322 C420 284, 540 284, 600 316" fill="none" stroke="#203243" stroke-width="3.8" marker-end="url(#arrow)"/>
  <text x="478" y="376" font-size="22" font-family="Arial" fill="#203243" text-anchor="middle" font-family="Arial">orientation g</text>
  <text x="478" y="402" font-size="16" font-family="Arial" fill="#54616d" text-anchor="middle" font-family="Arial">maps crystal vectors</text>
  <text x="478" y="424" font-size="16" font-family="Arial" fill="#54616d" text-anchor="middle" font-family="Arial">into specimen vectors</text>

  <g transform="translate(824,290)">
    <rect x="0" y="0" width="398" height="122" rx="18" fill="#f5efdd" stroke="#cbb98b" stroke-width="1.5"/>
    <text x="22" y="36" font-size="22" font-family="Arial" fill="#213140" font-family="Arial">Reference-reading rule</text>
    <text x="22" y="70" font-size="16" font-family="Arial" fill="#4d5966" font-family="Arial">When formulas are quoted, name both the symbol</text>
    <text x="22" y="94" font-size="16" font-family="Arial" fill="#4d5966" font-family="Arial">convention and the frame mapping direction.</text>
  </g>

  <!-- Card 2: the public convenience path. -->
  <rect x="42" y="566" width="1156" height="272" rx="24" fill="#fffdf8" stroke="#d7d0c3" stroke-width="1.8"/>
  <text x="68" y="606" font-size="25" font-family="Arial" fill="#193149" font-family="Arial">2. Public convenience path: Bunge Euler angles, canonical quaternions</text>

  <g transform="translate(84,640)">
    <rect x="0" y="0" width="534" height="180" rx="18" fill="#deead8" stroke="#507c5a" stroke-width="1.8"/>
    <text x="24" y="36" font-size="23" font-family="Arial" fill="#1c3424" font-family="Arial">Bunge Euler tuple</text>
    <text x="24" y="74" font-size="21" font-family="Arial" fill="#1c3424" font-family="Arial">(phi1, Phi, phi2)</text>
    <!-- The z -> x' -> z'' sequence arrow used to be drawn on top of the tuple
         text; it now has its own row inside the card. -->
    <text x="42" y="112" font-size="17" font-family="Arial" fill="#294533" font-family="Arial">z</text>
    <text x="176" y="112" font-size="17" font-family="Arial" fill="#294533" font-family="Arial">x'</text>
    <text x="310" y="112" font-size="17" font-family="Arial" fill="#294533" font-family="Arial">z''</text>
    <line x1="24" y1="124" x2="330" y2="124" stroke="#1e4f3d" stroke-width="3" marker-end="url(#arrow-seq)"/>
    <text x="24" y="154" font-size="16" font-family="Arial" fill="#294533" font-family="Arial">Sequence used in the texture references. Keep these labels</text>
    <text x="24" y="172" font-size="16" font-family="Arial" fill="#294533" font-family="Arial">unchanged in docs, examples, and parity notes.</text>
  </g>

  <g transform="translate(656,640)">
    <rect x="0" y="0" width="502" height="180" rx="18" fill="#e4eef8" stroke="#48708f" stroke-width="1.8"/>
    <text x="24" y="36" font-size="23" font-family="Arial" fill="#16314a" font-family="Arial">Quaternion storage</text>
    <text x="24" y="74" font-size="25" font-family="Arial" fill="#16314a" font-family="Arial">(w, x, y, z)</text>
    <text x="24" y="112" font-size="16" font-family="Arial" fill="#27455d" font-family="Arial">Unit norm is enforced and an equivalent sign</text>
    <text x="24" y="134" font-size="16" font-family="Arial" fill="#27455d" font-family="Arial">representative is chosen for stability. This keeps</text>
    <text x="24" y="156" font-size="16" font-family="Arial" fill="#27455d" font-family="Arial">matrix, Euler, and quaternion conversions</text>
    <text x="24" y="174" font-size="16" font-family="Arial" fill="#27455d" font-family="Arial">reproducible across tests.</text>
  </g>

  <text x="68" y="872" font-size="15" font-family="Arial" fill="#54616d" font-family="Arial">Source alignment: Rowenhorst et al. for rotation conventions; Randle and Engler for texture-facing Euler notation.</text>
</svg>
