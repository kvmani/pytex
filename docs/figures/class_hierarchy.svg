<svg xmlns="http://www.w3.org/2000/svg" width="1965" height="887" viewBox="0 0 1965 887" role="img">
  <title>PyTex Class Hierarchy</title>
  <desc>The complete inheritance structure of PyTex. Only a few families use subclassing: the TEM tilt envelopes, which are alternative geometric shapes behind one interface, and the elastic tensor pair. Everything else is a frozen dataclass composed of other objects, which is why the object-model diagrams rather than this one carry the library's structure.</desc>
  <defs>
    <marker id="cd-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 z" fill="#40506f"/>
    </marker>
    <marker id="cd-triangle" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="1" refY="6" orient="auto">
      <path d="M13,0 L1,6 L13,12 z" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
    </marker>
    <marker id="cd-diamond" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M1,5 L8,1 L15,5 L8,9 z" fill="#07122f"/>
    </marker>
  </defs>
