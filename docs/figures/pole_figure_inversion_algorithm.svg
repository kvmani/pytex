<svg xmlns="http://www.w3.org/2000/svg" width="1196" height="1228" viewBox="0 0 1196 1228" role="img">
  <title>Pole-figure inversion to an orientation distribution</title>
  <desc>Four-lane flow sheet. Lane 1 takes measured pole figures on the m.r.d. scale and applies the defocus correction. Lane 2 builds the kernel response operator and rescales it to the observations' scale. Lane 3 solves the non-negative, simplex-constrained, Tikhonov-regularised least-squares problem by projected gradient, with the harmonic series expansion as the alternative unknown. Lane 4 reports residuals and recalculates poles that were not fitted, which is the only check that carries information because the forward map is not injective.</desc>
  <defs>
    <marker id="pytex-algo-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 z" fill="#40506f"/>
    </marker>
    <marker id="pytex-algo-arrow-flow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1196" height="1228" fill="#fbfdff"/>
  <text x="40.0" y="46.0" font-size="25" font-family="Arial" fill="#07122f" text-anchor="start">Pole-figure inversion to an orientation distribution</text>
  <text x="40.0" y="72.0" font-size="13" font-family="Arial" fill="#40506f" text-anchor="start">ODF.invert_pole_figures - the discrete route, with the harmonic route alongside</text>
  <text x="40.0" y="96.0" font-size="13" font-family="Arial" fill="#7c3aed" text-anchor="start">1 - the measurement, corrected before it is inverted</text>
  <rect x="40.0" y="108.0" width="236.0" height="156.0" rx="8" fill="#eef7f0" stroke="#a7ccb4" stroke-width="1.4"/>
  <text x="54.0" y="135.0" font-size="15" font-family="Arial" fill="#124a2a" text-anchor="start" font-weight="bold">Measured pole figures</text>
  <text x="54.0" y="157.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">P_hkl(y), in m.r.d.</text>
  <text x="54.0" y="176.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Several independent {hkl}; one</text>
  <text x="54.0" y="192.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">is never</text>
  <text x="54.0" y="208.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">enough. Intensities on the</text>
  <text x="54.0" y="224.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">multiples-of-random scale.</text>
  <rect x="310.0" y="108.0" width="236.0" height="156.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="324.0" y="135.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">Defocus correction</text>
  <text x="324.0" y="154.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Calibrated from a texture-free</text>
  <text x="324.0" y="170.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">standard.</text>
  <text x="324.0" y="186.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Uncorrected, the inversion</text>
  <text x="324.0" y="202.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">reproduces an</text>
  <text x="324.0" y="218.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">instrumental rim as a texture</text>
  <text x="324.0" y="234.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">feature.</text>
  <line x1="276.0" y1="186.0" x2="306.0" y2="186.0" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <line x1="158.0" y1="264.0" x2="158.0" y2="304.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#pytex-algo-arrow-flow)"/>
  <text x="40.0" y="298.0" font-size="13" font-family="Arial" fill="#7c3aed" text-anchor="start">2 - build the operator on the observations' scale</text>
  <rect x="40.0" y="310.0" width="236.0" height="197.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="54.0" y="337.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">Kernel response</text>
  <text x="54.0" y="359.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">A[i,j] = sum_family</text>
  <text x="54.0" y="378.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">psi(angle(g_j h, y_i))</text>
  <text x="54.0" y="397.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Pole density of dictionary</text>
  <text x="54.0" y="413.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">orientation j</text>
  <text x="54.0" y="429.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">at measured direction i, summed</text>
  <text x="54.0" y="445.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">over the</text>
  <text x="54.0" y="461.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">{hkl} symmetry family.</text>
  <rect x="310.0" y="310.0" width="236.0" height="197.0" rx="8" fill="#fdf6e8" stroke="#e6d4a8" stroke-width="1.4"/>
  <text x="324.0" y="337.0" font-size="15" font-family="Arial" fill="#6b4a06" text-anchor="start" font-weight="bold">Rescale to m.r.d.</text>
  <text x="324.0" y="359.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">A &lt;- A /</text>
  <text x="324.0" y="378.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">random_pole_density(psi)</text>
  <text x="324.0" y="397.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">The raw kernel sum for a random</text>
  <text x="324.0" y="413.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">texture</text>
  <text x="324.0" y="429.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">is the kernel mean, not 1 - a</text>
  <text x="324.0" y="445.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">factor of</text>
  <text x="324.0" y="461.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">order 64 at a 12 degree</text>
  <text x="324.0" y="477.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">halfwidth.</text>
  <line x1="276.0" y1="408.5" x2="306.0" y2="408.5" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <rect x="856.0" y="310.0" width="300.0" height="141.0" rx="8" fill="#f7faff" stroke="#c8d8f2" stroke-width="1.0"/>
  <text x="872.0" y="335.0" font-size="14" font-family="Arial" fill="#07122f" text-anchor="start">Failure: a fit that reports success</text>
  <text x="872.0" y="358.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Skip the rescale and the weights cannot</text>
  <text x="872.0" y="377.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">absorb the kernel mean, because they are</text>
  <text x="872.0" y="396.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">constrained to sum to one. The solver stalls</text>
  <text x="872.0" y="415.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">near a relative residual of 1, its step stops</text>
  <text x="872.0" y="434.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">moving, and it reports convergence.</text>
  <line x1="158.0" y1="507.0" x2="158.0" y2="547.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#pytex-algo-arrow-flow)"/>
  <text x="40.0" y="541.0" font-size="13" font-family="Arial" fill="#7c3aed" text-anchor="start">3 - solve, constrained by what an ODF is</text>
  <rect x="40.0" y="553.0" width="236.0" height="165.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="54.0" y="580.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">Non-negative simplex fit</text>
  <text x="54.0" y="602.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">min |Aw - b|^2 + lam|w|^2,</text>
  <text x="54.0" y="621.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">w&gt;=0, sum w = 1</text>
  <text x="54.0" y="640.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Both constraints are physics: a</text>
  <text x="54.0" y="656.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">density</text>
  <text x="54.0" y="672.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">cannot be negative and</text>
  <text x="54.0" y="688.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">integrates to one.</text>
  <rect x="310.0" y="553.0" width="236.0" height="165.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="324.0" y="580.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">Projected gradient</text>
  <text x="324.0" y="602.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">w &lt;- proj_simplex(w - grad /</text>
  <text x="324.0" y="621.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">L)</text>
  <text x="324.0" y="640.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Step 1/L with L the Lipschitz</text>
  <text x="324.0" y="656.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">constant.</text>
  <text x="324.0" y="672.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Stationarity measured</text>
  <text x="324.0" y="688.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">scale-free.</text>
  <line x1="276.0" y1="635.5" x2="306.0" y2="635.5" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <rect x="580.0" y="553.0" width="236.0" height="165.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="594.0" y="580.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">Harmonic alternative</text>
  <text x="594.0" y="599.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Unknowns are symmetry-projected</text>
  <text x="594.0" y="615.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">coefficients to degree L</text>
  <text x="594.0" y="631.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">instead.</text>
  <text x="594.0" y="647.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Even degrees only: pole figures</text>
  <text x="594.0" y="663.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">carry</text>
  <text x="594.0" y="679.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">no odd information.</text>
  <line x1="546.0" y1="635.5" x2="576.0" y2="635.5" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <rect x="856.0" y="553.0" width="300.0" height="141.0" rx="8" fill="#f7faff" stroke="#c8d8f2" stroke-width="1.0"/>
  <text x="872.0" y="578.0" font-size="14" font-family="Arial" fill="#07122f" text-anchor="start">Constraint: scale-free stationarity</text>
  <text x="872.0" y="601.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">The raw step is proportional to 1/L, so on a</text>
  <text x="872.0" y="620.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">large-operator system the first step is tiny</text>
  <text x="872.0" y="639.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">for that reason alone. Multiplying by L and</text>
  <text x="872.0" y="658.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">dividing by |A^T b| makes one tolerance mean</text>
  <text x="872.0" y="677.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">the same thing in any units.</text>
  <rect x="856.0" y="708.0" width="300.0" height="141.0" rx="8" fill="#f7faff" stroke="#c8d8f2" stroke-width="1.0"/>
  <text x="872.0" y="733.0" font-size="14" font-family="Arial" fill="#07122f" text-anchor="start">Structural: the odd part is absent</text>
  <text x="872.0" y="756.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Friedel's law makes pole figures</text>
  <text x="872.0" y="775.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">centrosymmetric, so they determine only the</text>
  <text x="872.0" y="794.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">even-order ODF. No regularisation recovers</text>
  <text x="872.0" y="813.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">the odd part; ghost correction infers one</text>
  <text x="872.0" y="832.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">from positivity and states its cost.</text>
  <line x1="158.0" y1="863.0" x2="158.0" y2="903.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#pytex-algo-arrow-flow)"/>
  <text x="40.0" y="897.0" font-size="13" font-family="Arial" fill="#7c3aed" text-anchor="start">4 - judge the fit, do not trust it</text>
  <rect x="40.0" y="909.0" width="236.0" height="191.0" rx="8" fill="#f3eefc" stroke="#cdbdee" stroke-width="1.4"/>
  <text x="54.0" y="936.0" font-size="15" font-family="Arial" fill="#42227e" text-anchor="start" font-weight="bold">Residual report</text>
  <text x="54.0" y="958.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">relative residual, MAE, max</text>
  <text x="54.0" y="977.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">error, coverage</text>
  <text x="54.0" y="996.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Errors in m.r.d., so they read</text>
  <text x="54.0" y="1012.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">directly</text>
  <text x="54.0" y="1028.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">against the texture strength.</text>
  <rect x="310.0" y="909.0" width="236.0" height="191.0" rx="8" fill="#fdf6e8" stroke="#e6d4a8" stroke-width="1.4"/>
  <text x="324.0" y="936.0" font-size="15" font-family="Arial" fill="#6b4a06" text-anchor="start" font-weight="bold">Recalculate unfitted</text>
  <text x="324.0" y="955.0" font-size="15" font-family="Arial" fill="#6b4a06" text-anchor="start" font-weight="bold">poles</text>
  <text x="324.0" y="974.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">The only check that carries</text>
  <text x="324.0" y="990.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">information:</text>
  <text x="324.0" y="1006.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">the map is non-injective, so a</text>
  <text x="324.0" y="1022.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">low</text>
  <text x="324.0" y="1038.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">residual on the fitted poles</text>
  <text x="324.0" y="1054.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">proves</text>
  <text x="324.0" y="1070.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">nothing about the ODF.</text>
  <line x1="276.0" y1="1004.5" x2="306.0" y2="1004.5" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <text x="40.0" y="1152.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Not modelled here: ghost correction (see the ghost-correction page), grain</text>
  <text x="40.0" y="1170.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">statistics, and any claim of uniqueness - several ODFs reproduce one pole-figure</text>
  <text x="40.0" y="1188.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">set exactly.</text>
</svg>
