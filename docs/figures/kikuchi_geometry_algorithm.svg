<svg xmlns="http://www.w3.org/2000/svg" width="1196" height="930" viewBox="0 0 1196 930" role="img">
  <title>Kikuchi band geometry and pattern simulation</title>
  <desc>Three-lane flow sheet. Lane 1 enumerates candidate lattice planes, reduces antipodal pairs, and filters by the centring reflection condition and a kinematic intensity threshold. Lane 2 carries each plane normal into the laboratory frame through the crystal orientation and computes the Bragg angle from the relativistic electron wavelength. Lane 3 projects gnomonically, where great circles become straight lines, and reports band centre lines, edges at twice the Bragg angle, and the zone axes where bands intersect.</desc>
  <defs>
    <marker id="pytex-algo-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 z" fill="#40506f"/>
    </marker>
    <marker id="pytex-algo-arrow-flow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1196" height="930" fill="#fbfdff"/>
  <text x="40.0" y="46.0" font-size="25" font-family="Arial" fill="#07122f" text-anchor="start">Kikuchi band geometry and pattern simulation</text>
  <text x="40.0" y="72.0" font-size="13" font-family="Arial" fill="#40506f" text-anchor="start">simulate_kikuchi_pattern - the forward model that indexing inverts</text>
  <text x="40.0" y="96.0" font-size="13" font-family="Arial" fill="#7c3aed" text-anchor="start">1 - which planes can give a band</text>
  <rect x="40.0" y="108.0" width="236.0" height="149.0" rx="8" fill="#eef7f0" stroke="#a7ccb4" stroke-width="1.4"/>
  <text x="54.0" y="135.0" font-size="15" font-family="Arial" fill="#124a2a" text-anchor="start" font-weight="bold">Enumerate planes</text>
  <text x="54.0" y="157.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">(hkl) to max_index</text>
  <text x="54.0" y="176.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Cost is cubic in the index</text>
  <text x="54.0" y="192.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">limit.</text>
  <rect x="310.0" y="108.0" width="236.0" height="149.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="324.0" y="135.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">Antipodal reduction</text>
  <text x="324.0" y="154.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">(hkl) and its opposite are the</text>
  <text x="324.0" y="170.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">same</text>
  <text x="324.0" y="186.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">plane and would draw one band</text>
  <text x="324.0" y="202.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">twice.</text>
  <line x1="276.0" y1="182.5" x2="306.0" y2="182.5" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <rect x="580.0" y="108.0" width="236.0" height="149.0" rx="8" fill="#fdf6e8" stroke="#e6d4a8" stroke-width="1.4"/>
  <text x="594.0" y="135.0" font-size="15" font-family="Arial" fill="#6b4a06" text-anchor="start" font-weight="bold">Centring and intensity</text>
  <text x="594.0" y="157.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">reflection condition, then</text>
  <text x="594.0" y="176.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">|F|^2</text>
  <text x="594.0" y="195.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">A systematically absent</text>
  <text x="594.0" y="211.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">reflection</text>
  <text x="594.0" y="227.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">produces no band at all.</text>
  <line x1="546.0" y1="182.5" x2="576.0" y2="182.5" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <line x1="158.0" y1="257.0" x2="158.0" y2="297.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#pytex-algo-arrow-flow)"/>
  <text x="40.0" y="291.0" font-size="13" font-family="Arial" fill="#7c3aed" text-anchor="start">2 - into the laboratory frame</text>
  <rect x="40.0" y="303.0" width="236.0" height="181.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="54.0" y="330.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">Carry the normal through</text>
  <text x="54.0" y="352.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">n_lab = T_spec-&gt;lab .</text>
  <text x="54.0" y="371.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">R_cry-&gt;spec . n_cry</text>
  <text x="54.0" y="390.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Frames are checked, not</text>
  <text x="54.0" y="406.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">assumed: a</text>
  <text x="54.0" y="422.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">mismatch gives a plausible</text>
  <text x="54.0" y="438.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">wrong</text>
  <text x="54.0" y="454.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">pattern.</text>
  <rect x="310.0" y="303.0" width="236.0" height="181.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="324.0" y="330.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">Bragg angle</text>
  <text x="324.0" y="352.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">sin(theta_B) = lambda / 2d</text>
  <text x="324.0" y="371.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Relativistic wavelength. Planes</text>
  <text x="324.0" y="387.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">that</text>
  <text x="324.0" y="403.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">cannot satisfy it are dropped.</text>
  <line x1="276.0" y1="393.5" x2="306.0" y2="393.5" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <line x1="158.0" y1="484.0" x2="158.0" y2="524.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#pytex-algo-arrow-flow)"/>
  <text x="40.0" y="518.0" font-size="13" font-family="Arial" fill="#7c3aed" text-anchor="start">3 - onto the detector</text>
  <rect x="40.0" y="530.0" width="236.0" height="181.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="54.0" y="557.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">Gnomonic projection</text>
  <text x="54.0" y="579.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">great circles -&gt; straight</text>
  <text x="54.0" y="598.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">lines</text>
  <text x="54.0" y="617.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Origin at the pattern centre;</text>
  <text x="54.0" y="633.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">one unit</text>
  <text x="54.0" y="649.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">is one detector distance, so</text>
  <text x="54.0" y="665.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">the frame</text>
  <text x="54.0" y="681.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">is detector-size independent.</text>
  <rect x="310.0" y="530.0" width="236.0" height="181.0" rx="8" fill="#f3eefc" stroke="#cdbdee" stroke-width="1.4"/>
  <text x="324.0" y="557.0" font-size="15" font-family="Arial" fill="#42227e" text-anchor="start" font-weight="bold">Band edges</text>
  <text x="324.0" y="579.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">angular width = 2 theta_B</text>
  <text x="324.0" y="598.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Width measures d INVERSELY:</text>
  <text x="324.0" y="614.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">wide bands</text>
  <text x="324.0" y="630.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">are low-d planes.</text>
  <line x1="276.0" y1="620.5" x2="306.0" y2="620.5" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <rect x="580.0" y="530.0" width="236.0" height="181.0" rx="8" fill="#f3eefc" stroke="#cdbdee" stroke-width="1.4"/>
  <text x="594.0" y="557.0" font-size="15" font-family="Arial" fill="#42227e" text-anchor="start" font-weight="bold">Zone axes</text>
  <text x="594.0" y="579.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">h u + k v + l w = 0</text>
  <text x="594.0" y="598.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">The bright intersections a</text>
  <text x="594.0" y="614.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">human</text>
  <text x="594.0" y="630.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">indexes by.</text>
  <line x1="546.0" y1="620.5" x2="576.0" y2="620.5" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <rect x="856.0" y="530.0" width="300.0" height="122.0" rx="8" fill="#f7faff" stroke="#c8d8f2" stroke-width="1.0"/>
  <text x="872.0" y="555.0" font-size="14" font-family="Arial" fill="#07122f" text-anchor="start">Constraint: the forward hemisphere only</text>
  <text x="872.0" y="578.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Directions travelling away from the detector</text>
  <text x="872.0" y="597.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">have no intersection and are reported invalid.</text>
  <text x="872.0" y="616.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">A silent wrap would place a band on the</text>
  <text x="872.0" y="635.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">opposite side of the pattern.</text>
  <rect x="856.0" y="666.0" width="300.0" height="122.0" rx="8" fill="#f7faff" stroke="#c8d8f2" stroke-width="1.0"/>
  <text x="872.0" y="691.0" font-size="14" font-family="Arial" fill="#07122f" text-anchor="start">Reading: min_d_spacing drops WIDE bands</text>
  <text x="872.0" y="714.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Band width grows as spacing falls, so a</text>
  <text x="872.0" y="733.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">minimum-spacing cut removes the widest,</text>
  <text x="872.0" y="752.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">weakest, high-order bands - not the</text>
  <text x="872.0" y="771.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">narrowest.</text>
  <text x="40.0" y="854.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Geometric and kinematic: band positions and widths are exact, intensities are a</text>
  <text x="40.0" y="872.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">|F|^2 proxy. No excess/deficiency asymmetry, no dynamical contrast, no inelastic</text>
  <text x="40.0" y="890.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">background, no detector response.</text>
</svg>
