<svg xmlns="http://www.w3.org/2000/svg" width="1196" height="1183" viewBox="0 0 1196 1183" role="img">
  <title>Rietveld whole-profile refinement</title>
  <desc>Four-lane flow sheet. Lane 1 takes the raw measured profile with its background intact and enumerates reflection families once over a padded angular window. Lane 2 recomputes positions, intensities, profiles and background at every evaluation. Lane 3 minimises the weighted residual by bounded trust-region least squares and takes uncertainties from the Jacobian. Lane 4 reports the R factors, the Durbin-Watson statistic and the residual curve, which diagnoses what to refine next in a way no scalar does.</desc>
  <defs>
    <marker id="pytex-algo-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 z" fill="#40506f"/>
    </marker>
    <marker id="pytex-algo-arrow-flow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1196" height="1183" fill="#fbfdff"/>
  <text x="40.0" y="46.0" font-size="25" font-family="Arial" fill="#07122f" text-anchor="start">Rietveld whole-profile refinement</text>
  <text x="40.0" y="72.0" font-size="13" font-family="Arial" fill="#40506f" text-anchor="start">refine_rietveld - fitting the pattern point by point, not extracted intensities</text>
  <text x="40.0" y="96.0" font-size="13" font-family="Arial" fill="#7c3aed" text-anchor="start">1 - the model, assembled once</text>
  <rect x="40.0" y="108.0" width="236.0" height="165.0" rx="8" fill="#eef7f0" stroke="#a7ccb4" stroke-width="1.4"/>
  <text x="54.0" y="135.0" font-size="15" font-family="Arial" fill="#124a2a" text-anchor="start" font-weight="bold">Measured profile</text>
  <text x="54.0" y="157.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">y_obs(2theta), background NOT</text>
  <text x="54.0" y="176.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">subtracted</text>
  <text x="54.0" y="195.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Subtracting first removes the</text>
  <text x="54.0" y="211.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">background-scale correlation</text>
  <text x="54.0" y="227.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">the</text>
  <text x="54.0" y="243.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">uncertainties depend on.</text>
  <rect x="310.0" y="108.0" width="236.0" height="165.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="324.0" y="135.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">Enumerate reflections</text>
  <text x="324.0" y="157.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">over a PADDED angular window</text>
  <text x="324.0" y="176.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Once, from the starting cell.</text>
  <text x="324.0" y="192.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Padding</text>
  <text x="324.0" y="208.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">stops a dilating cell moving a</text>
  <text x="324.0" y="224.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">reflection in or out</text>
  <text x="324.0" y="240.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">mid-refinement.</text>
  <line x1="276.0" y1="190.5" x2="306.0" y2="190.5" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <line x1="158.0" y1="273.0" x2="158.0" y2="313.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#pytex-algo-arrow-flow)"/>
  <text x="40.0" y="307.0" font-size="13" font-family="Arial" fill="#7c3aed" text-anchor="start">2 - the forward calculation, per evaluation</text>
  <rect x="40.0" y="319.0" width="236.0" height="162.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="54.0" y="346.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">Positions</text>
  <text x="54.0" y="368.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">from the dilated cell + zero</text>
  <text x="54.0" y="387.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">shift</text>
  <rect x="310.0" y="319.0" width="236.0" height="162.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="324.0" y="346.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">Intensities</text>
  <text x="324.0" y="368.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">m |F|^2 L(theta) P_march</text>
  <text x="324.0" y="387.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Multiplicity, structure factor</text>
  <text x="324.0" y="403.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">with</text>
  <text x="324.0" y="419.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">B_iso, Lorentz-polarisation,</text>
  <text x="324.0" y="435.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">and the</text>
  <text x="324.0" y="451.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">March-Dollase texture factor.</text>
  <line x1="276.0" y1="400.0" x2="306.0" y2="400.0" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <rect x="580.0" y="319.0" width="236.0" height="162.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="594.0" y="346.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">Profile + background</text>
  <text x="594.0" y="368.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">Thompson-Cox-Hastings pV +</text>
  <text x="594.0" y="387.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">Chebyshev</text>
  <text x="594.0" y="406.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Widths from the Caglioti form</text>
  <text x="594.0" y="422.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">U tan^2 t + V tan t + W, plus</text>
  <text x="594.0" y="438.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Y.</text>
  <line x1="546.0" y1="400.0" x2="576.0" y2="400.0" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <line x1="158.0" y1="481.0" x2="158.0" y2="521.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#pytex-algo-arrow-flow)"/>
  <text x="40.0" y="515.0" font-size="13" font-family="Arial" fill="#7c3aed" text-anchor="start">3 - refine, bounded</text>
  <rect x="40.0" y="527.0" width="236.0" height="213.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="54.0" y="554.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">Trust-region least</text>
  <text x="54.0" y="573.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">squares</text>
  <text x="54.0" y="595.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">min sum w (y_obs - y_calc)^2</text>
  <text x="54.0" y="614.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">scipy least_squares. Every</text>
  <text x="54.0" y="630.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">parameter</text>
  <text x="54.0" y="646.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">bounded, because an unbounded</text>
  <text x="54.0" y="662.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">fit</text>
  <text x="54.0" y="678.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">reaches a lower R_wp at an</text>
  <text x="54.0" y="694.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">impossible</text>
  <text x="54.0" y="710.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">cell.</text>
  <rect x="310.0" y="527.0" width="236.0" height="213.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="324.0" y="554.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">Uncertainties</text>
  <text x="324.0" y="573.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">From the Jacobian at the</text>
  <text x="324.0" y="589.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">solution,</text>
  <text x="324.0" y="605.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">with the background still in</text>
  <text x="324.0" y="621.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">the model.</text>
  <line x1="276.0" y1="633.5" x2="306.0" y2="633.5" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <rect x="856.0" y="527.0" width="300.0" height="141.0" rx="8" fill="#f7faff" stroke="#c8d8f2" stroke-width="1.0"/>
  <text x="872.0" y="552.0" font-size="14" font-family="Arial" fill="#07122f" text-anchor="start">Constraint: bounds encode physics</text>
  <text x="872.0" y="575.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Zero shift within +/- 1 degree: beyond that</text>
  <text x="872.0" y="594.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">it is a broken diffractometer, and left free</text>
  <text x="872.0" y="613.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">it swaps places with the cell. Cell dilation</text>
  <text x="872.0" y="632.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">within 10 percent: a refinement wanting more</text>
  <text x="872.0" y="651.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">has misidentified the phase.</text>
  <rect x="856.0" y="682.0" width="300.0" height="141.0" rx="8" fill="#f7faff" stroke="#c8d8f2" stroke-width="1.0"/>
  <text x="872.0" y="707.0" font-size="14" font-family="Arial" fill="#07122f" text-anchor="start">Practice: refine incrementally</text>
  <text x="872.0" y="730.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">The default set is scale, zero, cell, one</text>
  <text x="872.0" y="749.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">width, and background. Turning everything on</text>
  <text x="872.0" y="768.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">at once reaches a low R_wp at a meaningless</text>
  <text x="872.0" y="787.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">minimum, because zero-against-cell and</text>
  <text x="872.0" y="806.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">background-against-scale trade freely.</text>
  <line x1="158.0" y1="837.0" x2="158.0" y2="877.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#pytex-algo-arrow-flow)"/>
  <text x="40.0" y="871.0" font-size="13" font-family="Arial" fill="#7c3aed" text-anchor="start">4 - judge it, and not by R_wp alone</text>
  <rect x="40.0" y="883.0" width="236.0" height="172.0" rx="8" fill="#f3eefc" stroke="#cdbdee" stroke-width="1.4"/>
  <text x="54.0" y="910.0" font-size="15" font-family="Arial" fill="#42227e" text-anchor="start" font-weight="bold">R factors</text>
  <text x="54.0" y="932.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">R_p, R_wp, R_exp, GoF =</text>
  <text x="54.0" y="951.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">R_wp/R_exp</text>
  <text x="54.0" y="970.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Fractions, not percentages.</text>
  <rect x="310.0" y="883.0" width="236.0" height="172.0" rx="8" fill="#fdf6e8" stroke="#e6d4a8" stroke-width="1.4"/>
  <text x="324.0" y="910.0" font-size="15" font-family="Arial" fill="#6b4a06" text-anchor="start" font-weight="bold">Durbin-Watson</text>
  <text x="324.0" y="929.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Serial correlation of the</text>
  <text x="324.0" y="945.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">weighted</text>
  <text x="324.0" y="961.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">residuals. Near 2 uncorrelated;</text>
  <text x="324.0" y="977.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">well</text>
  <text x="324.0" y="993.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">under 1 means systematic misfit</text>
  <text x="324.0" y="1009.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">that</text>
  <text x="324.0" y="1025.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">R_wp does not show.</text>
  <line x1="276.0" y1="969.0" x2="306.0" y2="969.0" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <rect x="580.0" y="883.0" width="236.0" height="172.0" rx="8" fill="#f3eefc" stroke="#cdbdee" stroke-width="1.4"/>
  <text x="594.0" y="910.0" font-size="15" font-family="Arial" fill="#42227e" text-anchor="start" font-weight="bold">Residual curve</text>
  <text x="594.0" y="929.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">The most informative single</text>
  <text x="594.0" y="945.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">output.</text>
  <text x="594.0" y="961.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Derivative-shaped at peaks:</text>
  <text x="594.0" y="977.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">positions.</text>
  <text x="594.0" y="993.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Symmetric at peaks: widths.</text>
  <text x="594.0" y="1009.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">High-angle only: B_iso or</text>
  <text x="594.0" y="1025.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">absorption.</text>
  <line x1="546.0" y1="969.0" x2="576.0" y2="969.0" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <text x="40.0" y="1107.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Use this when phase fractions, structure or profile parameters are the target.</text>
  <text x="40.0" y="1125.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">For the cell alone, the extrapolation route makes fewer assumptions and gives a</text>
  <text x="40.0" y="1143.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">better lattice parameter.</text>
</svg>
