<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" role="img">
  <title>Sample Frame (RD, TD, ND)</title>
  <desc>Reference frame 'sample_rd_td_nd' in the specimen domain, right-handed and orthonormal, with axes RD (rolling direction) -&gt; [1.0000 0.0000 0.0000], TD (transverse direction) -&gt; [0.0000 1.0000 0.0000], ND (normal direction) -&gt; [0.0000 0.0000 1.0000] given as components in the canonical Cartesian reference (X, Y, Z). Convention set: pytex_canonical (bunge_zxz Euler labeling, quaternions stored wxyz). Rolling-geometry sample frame: RD along the rolling direction, TD transverse to it in the sheet plane, ND along the sheet normal.</desc>
  <defs>
    <marker id="pytex-frame-arrow-47321-0" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,0 L13,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="pytex-frame-arrow-47321-1" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,0 L13,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="pytex-frame-arrow-47321-2" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,0 L13,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fbfdff"/>
  <text x="280" y="34" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#07122f" text-anchor="middle">Sample Frame (RD, TD, ND)</text>
  <text x="280" y="56" font-size="12" font-family="Arial, Helvetica, sans-serif" fill="#40506f" text-anchor="middle">RD rolling direction; TD transverse direction; ND sheet normal - a right-handed triad</text>
  <g>
    <line x1="280.00" y1="234.00" x2="280.00" y2="122.74" stroke="#dc2626" stroke-width="3.4" stroke-linecap="round" opacity="1" marker-end="url(#pytex-frame-arrow-47321-2)"/>
    <text x="280.00" y="86.74" font-size="16" font-family="Arial, Helvetica, sans-serif" fill="#dc2626" opacity="1" text-anchor="middle" dominant-baseline="middle">ND</text>
    <line x1="280.00" y1="234.00" x2="379.48" y2="259.14" stroke="#059669" stroke-width="3.4" stroke-linecap="round" opacity="1" marker-end="url(#pytex-frame-arrow-47321-1)"/>
    <text x="414.39" y="267.96" font-size="16" font-family="Arial, Helvetica, sans-serif" fill="#059669" opacity="1" text-anchor="middle" dominant-baseline="middle">TD</text>
    <line x1="280.00" y1="234.00" x2="212.90" y2="271.27" stroke="#1d4ed8" stroke-width="3.4" stroke-linecap="round" opacity="1" marker-end="url(#pytex-frame-arrow-47321-0)"/>
    <text x="181.42" y="288.75" font-size="16" font-family="Arial, Helvetica, sans-serif" fill="#1d4ed8" opacity="1" text-anchor="middle" dominant-baseline="middle">RD</text>
    <circle cx="280.00" cy="234.00" r="3.4" fill="#07122f"/>
  </g>
</svg>
