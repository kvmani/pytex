<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">PyTex EBSD Foundation Flow</title>
  <desc id="desc">EBSD foundation workflow showing adapter normalization and core orientation semantics feeding CrystalMap, neighborhood topology, grains, boundaries, and texture outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#07122f" flood-opacity="0.14"/></filter>
    <marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="24.00" markerHeight="24.00" refX="20.00" refY="12.00" orient="auto"><path d="M4.00,4.00 L20.00,12.00 L4.00,20.00 Z" fill="#07122f"/></marker>
    <style>.title{font:700 38px Arial, Helvetica, sans-serif;fill:#07122f}.subtitle{font:19px Arial, Helvetica, sans-serif;fill:#40506f}.label{font:700 20px Arial, Helvetica, sans-serif;fill:#07122f}.body{font:15px Arial, Helvetica, sans-serif;fill:#40506f}.card{rx:8;filter:url(#shadow);stroke-width:2}.arrow{fill:none;stroke:#07122f;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1100" height="650" fill="url(#bg)"/>
  <text x="550" y="58" text-anchor="middle" class="title">EBSD Foundation Flow</text>
  <text x="550" y="90" text-anchor="middle" class="subtitle">Map topology and grain semantics remain tied to explicit frames, phases, and provenance</text>
  <rect x="470" y="112" width="160" height="5" rx="3" fill="#2563eb"/><rect x="550" y="112" width="80" height="5" rx="3" fill="#7c3aed"/>

  <rect x="68" y="180" width="190" height="90" class="card" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="98" y="214" class="label">Adapters</text><text x="98" y="239" class="body"><tspan x="98" dy="0.0">vendor and third-party</tspan><tspan x="98" dy="19.2">inputs</tspan></text>
  <rect x="68" y="380" width="190" height="90" class="card" fill="#eff6ff" stroke="#2563eb"/>
  <text x="98" y="414" class="label">Canonical Core</text><text x="98" y="439" class="body"><tspan x="98" dy="0.0">frames, orientation,</tspan><tspan x="98" dy="19.2">provenance</tspan></text>
  <rect x="330" y="180" width="190" height="90" class="card" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="360" y="214" class="label">Import Manifest</text><text x="360" y="239" class="body">normalization contract</text>
  <rect x="330" y="380" width="190" height="90" class="card" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="360" y="414" class="label">CrystalMap</text><text x="360" y="439" class="body"><tspan x="360" dy="0.0">coordinates, phases,</tspan><tspan x="360" dy="19.2">quality</tspan></text>
  <rect x="602" y="180" width="190" height="90" class="card" fill="#ecfeff" stroke="#0f9f9f"/>
  <text x="632" y="214" class="label">Neighborhoods</text><text x="632" y="239" class="body"><tspan x="632" dy="0.0">regular grid and graph</tspan><tspan x="632" dy="19.2">topology</tspan></text>
  <rect x="602" y="380" width="241.7" height="90" class="card" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="632" y="414" class="label">Grains + Boundaries</text><text x="632" y="439" class="body">KAM, GROD, cleanup</text>
  <rect x="860" y="280" width="199.4" height="96" class="card" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="890" y="315" class="label">Texture Outputs</text><text x="890" y="340" class="body"><tspan x="890" dy="0.0">ODF, pole figures,</tspan><tspan x="890" dy="19.2">reports</tspan></text>

  <path class="arrow" d="M258 225 H330"/>
  <path class="arrow" d="M425 270 V380"/>
  <path class="arrow" d="M258 425 H330"/>
  <path class="arrow" d="M520 425 H602"/>
  <path class="arrow" d="M520 425 C565 380 585 260 602 225"/>
  <path class="arrow" d="M697 270 V380"/>
  <path class="arrow" d="M792 425 C840 420 850 370 860 340"/>
  <path class="arrow" d="M792 225 C840 235 850 286 860 315"/>
</svg>


