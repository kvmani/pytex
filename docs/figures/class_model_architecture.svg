      <path d="M0,0 L12,4.5 L0,9 z" fill="#40506f"/>
    </marker>
    <marker id="cd-triangle" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="1" refY="6" orient="auto">
      <path d="M13,0 L1,6 L13,12 z" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
    </marker>
    <marker id="cd-diamond" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M1,5 L8,1 L15,5 L8,9 z" fill="#07122f"/>
    </marker>
  </defs>
