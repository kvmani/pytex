<svg xmlns="http://www.w3.org/2000/svg" width="1394" height="1173" viewBox="0 0 1394 1173" role="img">
  <title>PyTex Library Architecture</title>
  <desc>Package-level architecture of PyTex. The canonical core carries frames, symmetry, lattice and orientation semantics; the texture, EBSD, diffraction and TEM domains build on it; adapters sit at the external boundary; plotting presents. Each arrow is labelled with the number of typed field references that cross that boundary in the source.</desc>
