<svg xmlns="http://www.w3.org/2000/svg" width="1196" height="1047" viewBox="0 0 1196 1047" role="img">
  <title>Grains, local misorientation, and dislocation density</title>
  <desc>Four-lane flow sheet. Lane 1 turns the orientation grid into a neighbour graph and computes symmetry-reduced pair disorientations. Lane 2 thresholds the edges and takes connected components, giving grains. Lane 3 derives the four local misorientation metrics, distinguished by what each compares a point with. Lane 4 forms the lattice curvature and Nye tensors and reports a lower-bound geometrically necessary dislocation density.</desc>
  <defs>
    <marker id="pytex-algo-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 z" fill="#40506f"/>
    </marker>
    <marker id="pytex-algo-arrow-flow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1196" height="1047" fill="#fbfdff"/>
  <text x="40.0" y="46.0" font-size="25" font-family="Arial" fill="#07122f" text-anchor="start">Grains, local misorientation, and dislocation density</text>
  <text x="40.0" y="72.0" font-size="13" font-family="Arial" fill="#40506f" text-anchor="start">segment_grains, the KAM/GROD/GOS/GAM family, and the Nye route to GND</text>
  <text x="40.0" y="96.0" font-size="13" font-family="Arial" fill="#7c3aed" text-anchor="start">1 - the map, as a graph</text>
  <rect x="40.0" y="108.0" width="236.0" height="149.0" rx="8" fill="#eef7f0" stroke="#a7ccb4" stroke-width="1.4"/>
  <text x="54.0" y="135.0" font-size="15" font-family="Arial" fill="#124a2a" text-anchor="start" font-weight="bold">Orientations on a grid</text>
  <text x="54.0" y="154.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Square (4/8) or hexagonal (6)</text>
  <text x="54.0" y="170.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">topology, with phases per</text>
  <text x="54.0" y="186.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">point.</text>
  <rect x="310.0" y="108.0" width="236.0" height="149.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="324.0" y="135.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">Neighbour pairs</text>
  <text x="324.0" y="157.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">first shell; phase boundaries</text>
  <text x="324.0" y="176.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">dropped</text>
  <text x="324.0" y="195.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">A misorientation between</text>
  <text x="324.0" y="211.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">different</text>
  <text x="324.0" y="227.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">phases is not defined here.</text>
  <line x1="276.0" y1="182.5" x2="306.0" y2="182.5" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <rect x="580.0" y="108.0" width="236.0" height="149.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="594.0" y="135.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">Pair disorientation</text>
  <text x="594.0" y="157.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">min over the symmetry orbit</text>
  <text x="594.0" y="176.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">576 candidates per cubic pair,</text>
  <text x="594.0" y="192.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">evaluated vectorised over all</text>
  <text x="594.0" y="208.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">pairs.</text>
  <line x1="546.0" y1="182.5" x2="576.0" y2="182.5" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <line x1="158.0" y1="257.0" x2="158.0" y2="297.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#pytex-algo-arrow-flow)"/>
  <text x="40.0" y="291.0" font-size="13" font-family="Arial" fill="#7c3aed" text-anchor="start">2 - grains</text>
  <rect x="40.0" y="303.0" width="236.0" height="165.0" rx="8" fill="#fdf6e8" stroke="#e6d4a8" stroke-width="1.4"/>
  <text x="54.0" y="330.0" font-size="15" font-family="Arial" fill="#6b4a06" text-anchor="start" font-weight="bold">Threshold the edges</text>
  <text x="54.0" y="352.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">keep pairs with angle &lt;=</text>
  <text x="54.0" y="371.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">theta_c</text>
  <text x="54.0" y="390.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Conventionally 5 to 15 degrees.</text>
  <rect x="310.0" y="303.0" width="236.0" height="165.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="324.0" y="330.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">Connected components</text>
  <text x="324.0" y="352.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">flood fill = components of</text>
  <text x="324.0" y="371.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">the edge set</text>
  <text x="324.0" y="390.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Grain ids numbered by each</text>
  <text x="324.0" y="406.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">component's lowest member, so</text>
  <text x="324.0" y="422.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">they are</text>
  <text x="324.0" y="438.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">a function of the data.</text>
  <line x1="276.0" y1="385.5" x2="306.0" y2="385.5" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <rect x="856.0" y="303.0" width="300.0" height="141.0" rx="8" fill="#f7faff" stroke="#c8d8f2" stroke-width="1.0"/>
  <text x="872.0" y="328.0" font-size="14" font-family="Arial" fill="#07122f" text-anchor="start">Inherent: flood fill merges gradients</text>
  <text x="872.0" y="351.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Points connected by a chain of small steps</text>
  <text x="872.0" y="370.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">join, so a grain with a continuous gradient</text>
  <text x="872.0" y="389.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">can exceed theta_c end to end and remain one</text>
  <text x="872.0" y="408.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">grain. That is the definition, not a defect -</text>
  <text x="872.0" y="427.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">and it is why GROD exists.</text>
  <line x1="158.0" y1="468.0" x2="158.0" y2="508.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#pytex-algo-arrow-flow)"/>
  <text x="40.0" y="502.0" font-size="13" font-family="Arial" fill="#7c3aed" text-anchor="start">3 - the four local metrics, by what each compares</text>
  <rect x="40.0" y="514.0" width="236.0" height="146.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="54.0" y="541.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">KAM</text>
  <text x="54.0" y="563.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">point vs its neighbours</text>
  <text x="54.0" y="582.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Short-wavelength gradient.</text>
  <text x="54.0" y="598.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Exclude boundaries or it</text>
  <text x="54.0" y="614.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">becomes a</text>
  <text x="54.0" y="630.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">boundary map.</text>
  <rect x="310.0" y="514.0" width="236.0" height="146.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="324.0" y="541.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">GROD</text>
  <text x="324.0" y="563.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">point vs its grain reference</text>
  <text x="324.0" y="582.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Long-wavelength rotation.</text>
  <line x1="276.0" y1="587.0" x2="306.0" y2="587.0" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <rect x="580.0" y="514.0" width="236.0" height="146.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="594.0" y="541.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">GOS / GAM</text>
  <text x="594.0" y="563.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">grain averages of the two</text>
  <text x="594.0" y="582.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Per-grain deformation measures.</text>
  <line x1="546.0" y1="587.0" x2="576.0" y2="587.0" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <rect x="856.0" y="514.0" width="300.0" height="103.0" rx="8" fill="#f7faff" stroke="#c8d8f2" stroke-width="1.0"/>
  <text x="872.0" y="539.0" font-size="14" font-family="Arial" fill="#07122f" text-anchor="start">Constraint: KAM is grid-dependent</text>
  <text x="872.0" y="562.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">A larger kernel smooths and lowers KAM, so</text>
  <text x="872.0" y="581.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">values are comparable only at equal step size</text>
  <text x="872.0" y="600.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">and equal order. Report both.</text>
  <line x1="158.0" y1="660.0" x2="158.0" y2="700.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#pytex-algo-arrow-flow)"/>
  <text x="40.0" y="694.0" font-size="13" font-family="Arial" fill="#7c3aed" text-anchor="start">4 - dislocation content</text>
  <rect x="40.0" y="706.0" width="236.0" height="213.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="54.0" y="733.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">Curvature tensor</text>
  <text x="54.0" y="755.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">kappa_ij = d omega_i / d x_j</text>
  <rect x="310.0" y="706.0" width="236.0" height="213.0" rx="8" fill="#eef4ff" stroke="#b9cdf2" stroke-width="1.4"/>
  <text x="324.0" y="733.0" font-size="15" font-family="Arial" fill="#0f2f6b" text-anchor="start" font-weight="bold">Nye tensor</text>
  <text x="324.0" y="755.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">alpha = kappa^T - tr(kappa) I</text>
  <line x1="276.0" y1="812.5" x2="306.0" y2="812.5" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <rect x="580.0" y="706.0" width="236.0" height="213.0" rx="8" fill="#f3eefc" stroke="#cdbdee" stroke-width="1.4"/>
  <text x="594.0" y="733.0" font-size="15" font-family="Arial" fill="#42227e" text-anchor="start" font-weight="bold">GND density</text>
  <text x="594.0" y="755.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">rho = sum |alpha_measurable|</text>
  <text x="594.0" y="774.0" font-size="13" font-family="Arial" fill="#2563eb" text-anchor="start">/ b</text>
  <text x="594.0" y="793.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">A LOWER BOUND: a surface scan</text>
  <text x="594.0" y="809.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">cannot</text>
  <text x="594.0" y="825.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">measure the gradient normal to</text>
  <text x="594.0" y="841.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">itself,</text>
  <text x="594.0" y="857.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">and statistically stored</text>
  <text x="594.0" y="873.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">dislocations</text>
  <text x="594.0" y="889.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">produce no curvature at all.</text>
  <line x1="546.0" y1="812.5" x2="576.0" y2="812.5" stroke="#40506f" stroke-width="2" marker-end="url(#pytex-algo-arrow)"/>
  <text x="40.0" y="971.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">Every number here depends on a choice: theta_c and connectivity for grains, step</text>
  <text x="40.0" y="989.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">and kernel for KAM, method and Burgers vector for GND. A result quoted without</text>
  <text x="40.0" y="1007.0" font-size="12" font-family="Arial" fill="#40506f" text-anchor="start">them is not reproducible.</text>
</svg>
