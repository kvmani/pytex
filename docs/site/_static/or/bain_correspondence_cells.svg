  <text x="715" y="554" text-anchor="middle" font-size="13" font-weight="bold" fill="#5d4037">Reading the picture</text>
  <text x="715" y="576" text-anchor="middle" font-size="11.5" fill="#5d4037">light blue: fcc atoms (cell corners + face centers)</text>
  <text x="715" y="594" text-anchor="middle" font-size="11.5" fill="#5d4037">orange: the fcc atoms that become bcc cell corners</text>
  <text x="715" y="612" text-anchor="middle" font-size="11.5" fill="#5d4037">deep orange: the fcc face center that becomes the</text>
  <text x="715" y="630" text-anchor="middle" font-size="11.5" fill="#5d4037">bcc body center &#8212; no diffusion, only distortion</text>
