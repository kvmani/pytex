  <text x="250" y="554" text-anchor="middle" font-size="13" font-weight="bold" fill="#37474f">Correspondence (Bain)</text>
  <text x="250" y="576" text-anchor="middle" font-size="12.5" fill="#37474f">[100]&#945; &#8592; &#189;[110]&#947;     [010]&#945; &#8592; &#189;[&#8722;110]&#947;     [001]&#945; &#8592; [001]&#947;</text>
  <text x="250" y="598" text-anchor="middle" font-size="12" fill="#00897b">principal stretches:  &#951;&#8321; = &#951;&#8322; = &#8730;2&#183;a&#945;/a&#947;,   &#951;&#8323; = a&#945;/a&#947;</text>
  <text x="250" y="618" text-anchor="middle" font-size="12" fill="#00897b">volume change:  &#916;V/V = 2(a&#945;/a&#947;)&#179; &#8722; 1</text>
