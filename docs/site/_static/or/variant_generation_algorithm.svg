<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="varrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#546e7a"/>
    </marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#263238">Variant generation: from one parallelism to the full symmetry orbit</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#546e7a">OrientationRelationship.generate_variants() &#8212; the algorithm and the Kurdjumov&#8211;Sachs numbers</text>

  <!-- Step 1 -->
  <rect x="60" y="80" width="420" height="66" rx="9" fill="#ede7f6" stroke="#3f51b5" stroke-width="2"/>
  <text x="270" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#3f51b5">1 &#183; Defining parallelism &#8594; rotation R</text>
  <text x="270" y="126" text-anchor="middle" font-size="12" fill="#37474f">orthonormal frames from (plane normal, in-plane direction)</text>
  <text x="270" y="140" text-anchor="middle" font-size="12" fill="#37474f">in both crystals; R maps the parent frame onto the child frame</text>

  <rect x="540" y="88" width="360" height="50" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="1.5"/>
  <text x="720" y="108" text-anchor="middle" font-size="12" fill="#5d4037">KS: (111)&#947; &#8741; (011)&#945; with [&#8722;101]&#947; &#8741; [&#8722;1&#8722;11]&#945;</text>
  <text x="720" y="126" text-anchor="middle" font-size="12" fill="#5d4037">one exact rotation, 42.85&#176; about &#9001;0.968 0.178 0.178&#9002;</text>

  <line x1="270" y1="146" x2="270" y2="178" stroke="#546e7a" stroke-width="2" marker-end="url(#varrow)"/>

  <!-- Step 2 -->
  <rect x="60" y="184" width="420" height="66" rx="9" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2"/>
  <text x="270" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#3f51b5">2 &#183; Parent-symmetry orbit  { R S&#8346; }</text>
  <text x="270" y="230" text-anchor="middle" font-size="12" fill="#37474f">apply every proper parent operator S&#8346; &#8712; G&#8346;:</text>
  <text x="270" y="244" text-anchor="middle" font-size="12" fill="#37474f">each candidate carries the parallelism to a symmetric equivalent</text>

  <rect x="540" y="192" width="360" height="50" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="1.5"/>
  <text x="720" y="212" text-anchor="middle" font-size="12" fill="#5d4037">cubic parent: |G&#8346;| = 24 proper rotations</text>
  <text x="720" y="230" text-anchor="middle" font-size="12" fill="#5d4037">24 candidate variant rotations for KS</text>

  <line x1="270" y1="250" x2="270" y2="282" stroke="#546e7a" stroke-width="2" marker-end="url(#varrow)"/>

  <!-- Step 3 -->
  <rect x="60" y="288" width="420" height="66" rx="9" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="270" y="314" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">3 &#183; Child-symmetry deduplication</text>
  <text x="270" y="334" text-anchor="middle" font-size="12" fill="#37474f">V&#8801;V&#8242; when V&#8242; = S<tspan font-size="9" baseline-shift="sub">c</tspan> V for some child operator S<tspan font-size="9" baseline-shift="sub">c</tspan> &#8712; G<tspan font-size="9" baseline-shift="sub">c</tspan>:</text>
  <text x="270" y="348" text-anchor="middle" font-size="12" fill="#37474f">keep one representative per left coset (quaternion-keyed)</text>

  <rect x="540" y="296" width="360" height="50" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="1.5"/>
  <text x="720" y="316" text-anchor="middle" font-size="12" fill="#5d4037">variant count = |G&#8346;| / |stabilizer of the pairing|</text>
  <text x="720" y="334" text-anchor="middle" font-size="12" fill="#5d4037">KS 24 &#183; NW 12 &#183; GT 24 &#183; Burgers 12 &#183; Bagaryatsky 12</text>

  <line x1="270" y1="354" x2="270" y2="386" stroke="#546e7a" stroke-width="2" marker-end="url(#varrow)"/>

  <!-- Step 4 -->
  <rect x="60" y="392" width="420" height="66" rx="9" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="270" y="418" text-anchor="middle" font-size="14" font-weight="bold" fill="#00695c">4 &#183; Variants  V&#8321; &#8230; V&#8342;</text>
  <text x="270" y="438" text-anchor="middle" font-size="12" fill="#37474f">TransformationVariant objects with 1-based indices;</text>
  <text x="270" y="452" text-anchor="middle" font-size="12" fill="#37474f">child orientations follow  g<tspan font-size="9" baseline-shift="sub">c</tspan> = g<tspan font-size="9" baseline-shift="sub">p</tspan> &#8728; V<tspan font-size="9" baseline-shift="sub">k</tspan><tspan font-size="9" baseline-shift="super">T</tspan></text>

  <line x1="270" y1="458" x2="270" y2="490" stroke="#546e7a" stroke-width="2" marker-end="url(#varrow)"/>
  <line x1="150" y1="458" x2="120" y2="490" stroke="#546e7a" stroke-width="2" marker-end="url(#varrow)"/>
  <line x1="390" y1="458" x2="420" y2="490" stroke="#546e7a" stroke-width="2" marker-end="url(#varrow)"/>

  <!-- Consumers -->
  <rect x="30" y="496" width="180" height="96" rx="9" fill="#fafafa" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="120" y="520" text-anchor="middle" font-size="13" font-weight="bold" fill="#37474f">Intervariant table</text>
  <text x="120" y="540" text-anchor="middle" font-size="11.5" fill="#546e7a">boundary misorientations</text>
  <text x="120" y="556" text-anchor="middle" font-size="11.5" fill="#546e7a">V<tspan font-size="8" baseline-shift="sub">a</tspan>V<tspan font-size="8" baseline-shift="sub">b</tspan><tspan font-size="8" baseline-shift="super">T</tspan> (Morito-validated)</text>
  <text x="120" y="576" text-anchor="middle" font-size="11" fill="#00897b">intervariant_misorientations</text>

  <rect x="230" y="496" width="180" height="96" rx="9" fill="#fafafa" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="320" y="520" text-anchor="middle" font-size="13" font-weight="bold" fill="#37474f">Packets</text>
  <text x="320" y="540" text-anchor="middle" font-size="11.5" fill="#546e7a">group by shared close-packed</text>
  <text x="320" y="556" text-anchor="middle" font-size="11.5" fill="#546e7a">parent plane (KS: 4 &#215; 6)</text>
  <text x="320" y="576" text-anchor="middle" font-size="11" fill="#00897b">variant_close_packed_groups</text>

  <rect x="430" y="496" width="180" height="96" rx="9" fill="#fafafa" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="520" y="520" text-anchor="middle" font-size="13" font-weight="bold" fill="#37474f">Variant pole figures</text>
  <text x="520" y="540" text-anchor="middle" font-size="11.5" fill="#546e7a">specimen-frame child poles</text>
  <text x="520" y="556" text-anchor="middle" font-size="11.5" fill="#546e7a">per variant, color-coded</text>
  <text x="520" y="576" text-anchor="middle" font-size="11" fill="#00897b">variant_pole_figure</text>

  <rect x="630" y="496" width="180" height="96" rx="9" fill="#fafafa" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="720" y="520" text-anchor="middle" font-size="13" font-weight="bold" fill="#37474f">Variant selection</text>
  <text x="720" y="540" text-anchor="middle" font-size="11.5" fill="#546e7a">assign observed children</text>
  <text x="720" y="556" text-anchor="middle" font-size="11.5" fill="#546e7a">to nearest variant</text>
  <text x="720" y="576" text-anchor="middle" font-size="11" fill="#00897b">select_variants</text>

  <!-- Side note -->
  <rect x="540" y="392" width="390" height="66" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="735" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">Why the orbit closes</text>
  <text x="735" y="432" text-anchor="middle" font-size="11.5" fill="#37474f">the variant set is the double coset G<tspan font-size="8" baseline-shift="sub">c</tspan> R G<tspan font-size="8" baseline-shift="sub">p</tspan> sampled once per</text>
  <text x="735" y="448" text-anchor="middle" font-size="11.5" fill="#37474f">child coset &#8212; parent symmetry generates, child symmetry merges</text>
</svg>
