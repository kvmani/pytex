  <text x="785" y="146" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#37474f">Three ORs, one picture</text>
  <text x="655" y="172" font-size="12.5" font-weight="bold" fill="#3f51b5">Burgers</text>
  <text x="655" y="190" font-size="11.5" fill="#37474f">a&#8321; &#8741; [&#8722;111]&#945; &#8212; hexagon locked to the</text>
  <text x="655" y="206" font-size="11.5" fill="#37474f">close-packed bcc diagonal (drawn here)</text>
  <text x="655" y="232" font-size="12.5" font-weight="bold" fill="#3f51b5">Pitsch&#8211;Schrader</text>
  <text x="655" y="250" font-size="11.5" fill="#37474f">a&#8321; &#8741; [001]&#945; &#8212; in-plane rotation by</text>
  <text x="655" y="266" font-size="11.5" fill="#37474f">60&#176; &#8722; 54.74&#176; = 5.26&#176; (red wedge)</text>
  <text x="655" y="292" font-size="12.5" font-weight="bold" fill="#3f51b5">Potter</text>
  <text x="655" y="310" font-size="11.5" fill="#37474f">keeps a&#8321; &#8741; [&#8722;111]&#945; but tilts the basal off</text>
  <text x="655" y="326" font-size="11.5" fill="#37474f">(110) by ~1&#8211;2&#176; to make (01&#8722;11) &#8741; {110}</text>
