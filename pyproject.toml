[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytex"
dynamic = ["version"]
description = "Pure-Python-first crystallographic texture and diffraction foundation library."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [
  { name = "PyTex contributors" }
]
keywords = [
  "crystallography",
  "texture",
  "diffraction",
  "ebsd",
  "odf",
  "pole-figure",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Visualization",
]
# One environment, one behaviour.
#
# PyTex used to keep the scientific stack behind a `pip install pytex[adapters]`
# extra, so the same call could compute a result on one machine and raise
# ModuleNotFoundError on another -- a CBED symmetry analysis of gallium arsenide
# being the case that finally settled it. Every package below is a reputable,
# actively maintained scientific library, and a crystallography library that
# cannot read a CIF is not usefully installed, so they are required rather than
# suggested. `pytex[adapters]`, `pytex[plotting]` and `pytex[hdf5]` remain as
# aliases so existing install commands keep working.
dependencies = [
  # diffsims and KikuchiPy are the packages the PyTex adapters are written
  # against. PyTex does not import either one -- the bridges take the caller's
  # object and read it structurally, which is what keeps their semantics out of
  # the PyTex model -- but `pytex.adapters.index_hough` calls
  # `signal.hough_indexing(...)` and cannot run without KikuchiPy present, and
  # the interop surfaces are meaningless in an environment that has neither.
  # Declaring them is what makes "PyTex offers a KikuchiPy bridge" a statement
  # about the installed environment rather than about the caller's homework.
  "diffsims>=0.6.1",
  # h5py backs the EDAX OIM HDF5 scan reader (`read_oh5`, for .oh5 and .h5).
  "h5py>=3.10",
  "kikuchipy>=0.11.5",
  # matplotlib renders every figure PyTex draws, including the SVG bundles the
  # dossier and export surfaces write.
  "matplotlib>=3.8",
  "numpy>=1.26",
  # orix supplies the orientation and Miller types the adapters convert to and
  # from, and the crystal-map model KikuchiPy hands back.
  "orix>=0.13.3",
  # pymatgen parses CIF structures, determines their space groups through
  # spglib, and is the authority for element data: atomic numbers, radii, and
  # the scattering parameters the X-ray form-factor table is generated from.
  "pymatgen>=2024.5.1",
  # PyYAML backs two declared data contracts that are on the core import
  # path: the plotting style themes and the measured-SAED pattern format.
  # It is a genuine runtime requirement, not an optional extra.
  "pyyaml>=6.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100",
  # jsonschema validates the published JSON contracts against their schemas in
  # `schemas/`. A check that silently skips is not a check, so it is part of the
  # test environment rather than something a lane may or may not have.
  "jsonschema>=4.21",
  # Upper bounds on the type checker and on the array library it reads stubs
  # from. Both are tooling constraints for the checks, not runtime constraints:
  # `numpy>=1.26` in the runtime dependencies above is deliberately open, and
  # users are unaffected by either bound.
  #
  # numpy: from 2.5 its stubs use PEP 695 `type` statements, which mypy refuses
  # to parse while `python_version = "3.11"` -- and 3.11 is the version this
  # package supports, so lowering the guarantee to make the stub parse would be
  # the wrong trade. Remove the bound when mypy parses stub syntax
  # independently of the analysis target.
  #
  # mypy: 2.x changed which error code a missing optional import reports, and
  # the codebase's ignores are written against 1.x. Removable once those are
  # revisited; the pin is what makes the checks reproducible in the meantime.
  "mypy>=1.10,<2",
  "numpy<2.5",
  "pytest>=8.2,<9",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]
docs = [
  "furo>=2024.1.29",
  "myst-nb>=1.1",
  "myst-parser>=3.0",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.6",
  "sphinxcontrib-bibtex>=2.6",
  "sphinx>=7.4",
]
# The desktop window. Optional on purpose: `python -m pytex.app desktop` opens
# the default browser instead when this is absent, so the application has no
# mandatory dependency beyond the library itself. It is a window, not a
# capability: nothing PyTex computes depends on whether it is installed.
desktop = [
  "pywebview>=5.0",
]
# Compatibility aliases. matplotlib, h5py, pymatgen, orix, diffsims and
# KikuchiPy are required dependencies as of 0.5.0, so these extras add nothing;
# they exist so that `pip install pytex[adapters]` and the other install
# commands already written down in deployment scripts and READMEs keep resolving
# instead of failing on an unknown extra. They will be removed no earlier than
# 1.0.
adapters = []
hdf5 = []
plotting = []

[project.scripts]
pytex = "pytex.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

# The version has exactly one literal, in src/pytex/_version.py. setuptools reads
# it statically, so the build never imports the package or its dependencies.
[tool.setuptools.dynamic]
version = {attr = "pytex._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pytex" = ["py.typed"]
# The frontend is the application. It must be inside the wheel, or an installed
# PyTex serves a 500 from an empty static root.
"pytex.app" = [
  "static/*.html",
  "static/*.css",
  "static/js/*.js",
  "static/js/**/*.js",
  # The built documentation, rendered by `python scripts/build_docs_bundle.py`
  # before the distribution is built. Without it an installed PyTex serves a
  # 404 from /docs/, because the only other places `docs_root()` looks are
  # build directories that exist in a checkout and travel nowhere. The office
  # deployment is an air-gapped intranet host with no checkout, no network and
  # no Sphinx, so the HTML has to be inside the wheel.
  "static/docs/**/*",
]
"pytex.diffraction._data" = ["*.json"]
"pytex.plotting.themes" = ["*.yaml"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = [
  "error",
  # External pymatgen CIF-parsing chatter; the
  # messages are informational and version-dependent, not PyTex defects.
  "ignore:Issues encountered while parsing CIF:UserWarning",
  "ignore:No _symmetry_equiv_pos_as_xyz type key found:UserWarning",
  "ignore:dict interface is deprecated. Use attribute interface instead:DeprecationWarning",
  # spglib >= 2.7 announces its own error-handling migration from inside the
  # library on every call that goes through the legacy path. It reports a
  # spglib-internal deprecation, not a PyTex defect, and no caller-side filter
  # or adapter shim can suppress it at the point of emission.
  "ignore:Set OLD_ERROR_HANDLING to false:DeprecationWarning",
  # orix builds its Phase on diffpy.structure, which is renaming its own API,
  # and every `to_orix_phase` call therefore emits diffpy's deprecation from
  # inside orix. It is a migration between two packages PyTex depends on
  # through a third; there is no caller-side spelling that avoids it, and it
  # will disappear when orix moves to the new names.
  "ignore:'diffpy.structure.GetSpaceGroup' is deprecated:DeprecationWarning",
  "ignore:'diffpy.structure.Structure.placeInLattice' is deprecated:DeprecationWarning",
  # And the module itself, which the package emits from `__getattr__` -- so
  # anything that walks `sys.modules` reading attributes triggers it. Hypothesis
  # does exactly that when it collects local constants, which turned every
  # property-based test in the suite red.
  "ignore:Module 'diffpy.Structure' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/site/tutorials/notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_worked_examples.py" = ["E501"]
"worked_examples/examples/*.py" = ["E501"]
# Greek alpha and beta are the published names of the TEM holder tilt axes, so
# they are the correct characters in figure labels rather than confusable ones.
"src/pytex/plotting/tilt_stereogram.py" = ["RUF001"]
# Greek letters are the published names of the phases in every orientation
# relationship the calculator offers - austenite is gamma, ferrite is alpha,
# the bcc titanium phase is beta - so they are the correct characters in the
# help text a metallurgist reads, not confusable Latin ones.
"src/pytex/app/services/calculator.py" = ["RUF001"]
# The OOXML content-type and relationship URIs are fixed by the ECMA-376
# standard. They cannot be wrapped, and a line-length exemption is preferable to
# reassembling them from fragments, which would make them unsearchable.
"src/pytex/app/export.py" = ["E501"]
# Greek alpha and beta are the published names of the TEM holder tilt axes, and
# sigma is the standard symbol for their uncertainty, so they are the correct
# characters in the column headers a microscopist reads.
"src/pytex/app/services/tem.py" = ["RUF001"]
# This module exists to hold the registered symbols in the characters the
# literature writes them with. Every Greek letter in it is deliberate and is the
# whole point of the file, so the confusable-character rules have nothing left
# to say here: a warning on every entry would be noise that trains the reader to
# ignore the rule where it does catch something.
"src/pytex/core/symbols.py" = ["RUF001", "RUF002"]

[tool.mypy]
python_version = "3.11"
strict = true
disable_error_code = ["type-arg"]
packages = ["pytex"]

# The scientific stack -- pymatgen, orix, diffsims, KikuchiPy, h5py -- is
# required as of 0.5.0 and installed in every lane, but none of it ships type
# stubs, so mypy must be told to treat those modules as untyped rather than to
# fail on them.
[[tool.mypy.overrides]]
module = [
  "diffsims", "diffsims.*",
  "h5py", "h5py.*",
  "kikuchipy", "kikuchipy.*",
  "orix", "orix.*",
  "pymatgen", "pymatgen.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*", "mpl_toolkits", "mpl_toolkits.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

# pywebview backs the optional native desktop window. It is an optional extra
# by design - the desktop shell falls back to the default browser without it -
# so the type checker must not require it to be installed.
[[tool.mypy.overrides]]
module = ["webview", "webview.*"]
ignore_missing_imports = true
