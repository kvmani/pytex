[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytex"
version = "0.1.0.dev0"
description = "Pure-Python-first crystallographic texture and diffraction foundation library."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "PyTex contributors" }
]
keywords = [
  "crystallography",
  "texture",
  "diffraction",
  "ebsd",
  "odf",
  "pole-figure",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100",
  "matplotlib>=3.8",
  "mypy>=1.10",
  "pytest>=8.2,<9",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]
docs = [
  "furo>=2024.1.29",
  "myst-nb>=1.1",
  "myst-parser>=3.0",
  "sphinxcontrib-mermaid>=1.0.0",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.6",
  "sphinxcontrib-bibtex>=2.6",
  "sphinx>=7.4",
]
plotting = [
  "matplotlib>=3.8",
]
adapters = [
  "diffsims>=0.6.1",
  "kikuchipy>=0.11.5",
  "orix>=0.13.3",
  "pyebsdindex>=0.2.dev1",
  "pymatgen>=2024.5.1",
]

[project.scripts]
pytex = "pytex.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pytex" = ["py.typed"]
"pytex.diffraction._data" = ["*.json"]
"pytex.plotting.themes" = ["*.yaml"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = [
  "error",
  # External pymatgen CIF-parsing chatter (full-scientific lane only); the
  # messages are informational and version-dependent, not PyTex defects.
  "ignore:Issues encountered while parsing CIF:UserWarning",
  "ignore:No _symmetry_equiv_pos_as_xyz type key found:UserWarning",
  "ignore:dict interface is deprecated. Use attribute interface instead:DeprecationWarning",
  # spglib >= 2.7 announces its own error-handling migration from inside the
  # library on every call that goes through the legacy path. It reports a
  # spglib-internal deprecation, not a PyTex defect, and no caller-side filter
  # or adapter shim can suppress it at the point of emission.
  "ignore:Set OLD_ERROR_HANDLING to false:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/site/tutorials/notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_worked_examples.py" = ["E501"]
"worked_examples/examples/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
disable_error_code = ["type-arg"]
packages = ["pytex"]

[[tool.mypy.overrides]]
module = ["pymatgen", "pymatgen.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*", "mpl_toolkits", "mpl_toolkits.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
